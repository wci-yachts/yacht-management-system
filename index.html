<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>West Coast International — Charter & Sale Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy-950:#071522;
  --navy-900:#0b2033;
  --navy-800:#123049;
  --navy-700:#1c4467;
  --brass:#4f8a41;
  --brass-light:#6fae5e;
  --teal:#0b2033;
  --teal-light:#7c93a8;
  --paper:#fbfbfa;
  --paper-dim:#eef1ec;
  --ink:#12181e;
  --ink-soft:#5c6570;
  --line:#dde1db;
  --white:#ffffff;
  --danger:#a13f2e;
  --danger-bg:#f8e8e4;
  --warn:#96751f;
  --warn-bg:#f6efd9;
  --ok:#3d6b4c;
  --ok-bg:#e6f0e8;
  --radius:2px;
  --shadow:0 1px 2px rgba(7,21,34,.05),0 8px 24px rgba(7,21,34,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
}
::selection{background:var(--brass-light);color:var(--navy-950);}

/* ---------- layout shell ---------- */
.app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  background:linear-gradient(180deg,var(--navy-900),var(--navy-950));
  color:var(--white);
  padding:0 28px;
  display:flex;
  align-items:center;
  gap:36px;
  height:64px;
  border-bottom:1px solid rgba(200,152,63,.35);
  position:sticky;top:0;z-index:40;
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-family:'Arial',sans-serif;
  font-weight:700;
  font-size:19px;
  letter-spacing:.01em;
  white-space:nowrap;
}
.brand .mark{
  width:28px;height:28px;
  border:1.5px solid var(--brass);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Poppins','Arial',sans-serif;
  font-weight:600;
  font-size:14px;color:var(--brass-light);
  flex-shrink:0;
}
.brand small{
  display:block;font-family:'Arial',sans-serif;font-weight:400;font-size:10px;
  letter-spacing:.14em;color:var(--teal-light);text-transform:uppercase;margin-top:1px;
}
nav.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;}
nav.tabs button{
  background:transparent;border:none;color:rgba(255,253,248,.65);
  font-family:'Inter';font-weight:600;font-size:12.5px;letter-spacing:.03em;
  padding:9px 14px;border-radius:2px;cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;transition:.15s;
}
nav.tabs button:hover{color:var(--white);}
nav.tabs button.active{color:var(--brass-light);border-bottom-color:var(--brass);}
.topbar .actions{display:flex;gap:8px;flex-shrink:0;}

main{flex:1;padding:26px 28px 60px;max-width:1280px;margin:0 auto;width:100%;}

/* ---------- generic ui ---------- */
.btn{
  font-family:'Inter';font-weight:600;font-size:12.5px;letter-spacing:.02em;
  padding:9px 16px;border-radius:var(--radius);border:1px solid transparent;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.12s;
}
.btn-primary{background:var(--navy-900);color:var(--white);}
.btn-primary:hover{background:var(--navy-800);}
.btn-brass{background:var(--brass);color:var(--navy-950);}
.btn-brass:hover{background:var(--brass-light);}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-ghost:hover{background:var(--paper-dim);}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger);}
.btn-danger:hover{background:var(--danger-bg);}
.btn-sm{padding:5px 10px;font-size:11.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.topbar .btn-ghost{border-color:rgba(255,253,248,.3);color:var(--white);}
.topbar .btn-ghost:hover{background:rgba(255,253,248,.08);}

input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{
  font-family:'Inter';font-size:13.5px;color:var(--ink);
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 10px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-light);outline-offset:0;border-color:var(--teal);}
textarea{resize:vertical;min-height:90px;font-family:'Inter';}
label.field-label{
  display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:5px;
}
.field{margin-bottom:14px;}
.field-hint{font-size:11px;color:var(--ink-soft);margin-top:4px;}
.row{display:grid;gap:16px;}
.row.c2{grid-template-columns:1fr 1fr;}
.row.c3{grid-template-columns:1fr 1fr 1fr;}
.row.c4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media(max-width:760px){.row.c2,.row.c3,.row.c4{grid-template-columns:1fr;}}

.card{
  background:var(--white);border:1px solid var(--line);border-radius:6px;
  box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;
}
.card-head{
  padding:16px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:linear-gradient(180deg,var(--white),var(--paper-dim));
}
.card-head h2{
  font-family:'Arial','Poppins',sans-serif;font-weight:700;font-size:15.5px;margin:0;color:var(--navy-900);
  display:flex;align-items:center;gap:8px;
}
.card-head .eyebrow{
  font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--brass);
  letter-spacing:.08em;
}
.card-body{padding:20px;}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
}
.badge-retail{background:#e6ebf0;color:var(--navy-800);}
.badge-central{background:#e6efe2;color:var(--brass);}
.badge-ok{background:var(--ok-bg);color:var(--ok);}
.badge-warn{background:var(--warn-bg);color:var(--warn);}
.badge-danger{background:var(--danger-bg);color:var(--danger);}
.badge-idle{background:var(--paper-dim);color:var(--ink-soft);}
.badge-progress{background:var(--brass);color:var(--navy-950);}
.status-dot{
  display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 0 1px rgba(0,0,0,.08);
}
.status-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;}

.pill-toggle{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;}
.pill-toggle button{
  border:none;background:var(--white);padding:7px 16px;font-size:12px;font-weight:600;
  cursor:pointer;color:var(--ink-soft);
}
.pill-toggle button.active.retail{background:var(--navy-950);color:var(--white);}
.pill-toggle button.active.central{background:var(--brass);color:var(--navy-950);}

.rating-scale{display:flex;gap:5px;flex-wrap:wrap;}
.rating-cell{
  width:32px;height:32px;border-radius:6px;border:1.5px solid var(--line);background:var(--white);
  font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;color:var(--ink-soft);
  cursor:pointer;transition:.12s;
}
.rating-cell:hover{border-color:var(--brass);color:var(--navy-900);}
.rating-cell.active{background:var(--brass);border-color:var(--brass);color:var(--navy-950);}
@media print{ .rating-cell{border-width:1px;} .rating-cell.active{background:#ddd !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;} }

.cal-month-label{
  font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--navy-900);
  margin:4px 0 10px;
}
.cal-grid-head{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.cal-headcell{
  text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);padding:2px 6px;
}
.cal-week{border:1px solid var(--line);border-radius:5px;background:var(--paper);margin-bottom:5px;overflow:hidden;}
.cal-week-daynums{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);}
.cal-daycell{
  padding:3px 6px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-soft);font-weight:600;
  border-right:1px solid var(--line);
}
.cal-daycell:last-child{border-right:none;}
.cal-daycell-out{opacity:.4;background:var(--paper-dim);}
.cal-daycell-today{background:#fdf3d9;color:var(--navy-900);}
.cal-week-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:3px;}
.cal-bar{
  display:flex;align-items:center;padding:2px 7px;font-size:10.5px;font-weight:700;color:#fff;
  cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.cal-bar:hover{filter:brightness(1.1);}
.cal-bar-label{overflow:hidden;text-overflow:ellipsis;}
@media(max-width:760px){
  .cal-headcell{font-size:9px;}
  .cal-bar{font-size:9.5px;}
}
@media print{
  .cal-week{break-inside:avoid;}
}

.role-bar{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  background:var(--navy-950);border-radius:6px;padding:14px 18px;
  margin-bottom:20px;box-shadow:var(--shadow);
}
.role-bar-label{
  font-family:'Arial','Poppins',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--brass-light);flex-shrink:0;
}
.role-bar-options{display:flex;gap:10px;flex:1;flex-wrap:wrap;}
.role-option{
  display:flex;align-items:center;justify-content:center;gap:9px;text-align:center;
  flex:1;min-width:160px;
  background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.14);
  border-radius:5px;padding:12px 14px;cursor:pointer;transition:.14s;
}
.role-option:hover{background:rgba(255,255,255,.08);}
.role-option.active{background:var(--white);border-color:var(--white);}
.role-option-check{
  width:18px;height:18px;border-radius:50%;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid rgba(255,255,255,.4);font-size:11px;font-weight:700;color:var(--white);
}
.role-option.active .role-option-check{border-color:var(--brass);background:var(--brass);color:var(--navy-950);}
.role-option-text{display:flex;flex-direction:column;gap:2px;}
.role-option-title{font-family:'Arial','Poppins',sans-serif;font-weight:700;font-size:14.5px;color:rgba(255,255,255,.9);}
.role-option.active .role-option-title{color:var(--navy-950);}
.role-option-desc{font-size:11.5px;line-height:1.4;color:rgba(255,255,255,.55);}
.role-option.active .role-option-desc{color:var(--ink-soft);}

table{width:100%;border-collapse:collapse;}
th{
  text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:700;padding:9px 12px;border-bottom:1.5px solid var(--line);
  background:var(--paper-dim);
}
th.sortable-col{cursor:pointer;user-select:none;}
th.sortable-col:hover{color:var(--navy-900);}
@media print{ th.sortable-col{cursor:default;} }
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.cases-table th,.cases-table td{padding-left:7px;padding-right:7px;white-space:nowrap;}
.cases-table td:nth-child(3){white-space:normal;}
@media(max-width:1400px){.cases-table{font-size:12.5px;}}
tr.clickable:hover{background:var(--paper-dim);cursor:pointer;}
.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px;}
.amount{font-family:'JetBrains Mono',monospace;font-weight:600;}
.muted{color:var(--ink-soft);}

.empty-state{
  text-align:center;padding:60px 20px;color:var(--ink-soft);
}
.empty-state .mark-big{
  width:52px;height:52px;border:2px solid var(--line);border-radius:50%;margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;font-family:'Poppins','Arial',sans-serif;font-weight:600;font-size:18px;color:var(--line);
}

.checklist-item{
  display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);
}
.checklist-item:last-child{border-bottom:none;}
.checklist-item input[type=checkbox]{width:17px;height:17px;accent-color:var(--teal);flex-shrink:0;}
.checklist-item label{font-size:13px;flex:1;}
.checklist-item input[type=text]{flex:1;}

.attach-remove{background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;}
.drag-handle{cursor:grab;font-size:16px;color:var(--ink-soft);display:inline-block;padding:2px 4px;user-select:none;touch-action:none;}
.drag-handle:active{cursor:grabbing;}
tr.dragging-row{opacity:.45;}
tr.drag-insert-before{box-shadow: inset 0 3px 0 0 var(--brass);}
tr.drag-insert-after{box-shadow: inset 0 -3px 0 0 var(--brass);}
@media print{ .drag-handle{display:none;} }

.divider-label{
  font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--teal);margin:22px 0 12px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:8px;
}
.divider-label:first-child{margin-top:0;padding-top:0;border-top:none;}

.calc-pair{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:center;}
.override-flag{font-size:10px;color:var(--brass);font-weight:700;letter-spacing:.03em;}

.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
@media(max-width:900px){.dash-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{
  background:var(--white);border:1px solid var(--line);border-radius:6px;padding:16px 18px;
  box-shadow:var(--shadow);
}
.stat-card .num{font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:var(--navy-900);}
.stat-card.danger .num{color:var(--danger);}
.stat-card.warn .num{color:var(--warn);}
.stat-card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600;margin-top:2px;}

.toast{
  position:fixed;bottom:22px;right:22px;background:var(--navy-950);color:var(--white);
  padding:12px 18px;border-radius:5px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);
  z-index:200;display:flex;align-items:center;gap:10px;border-left:3px solid var(--brass);
  animation:toastin .2s ease;
}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search-bar input[type=text]{max-width:280px;}
.search-bar select{max-width:200px;}

.file-input-wrap{display:none;}

@media print{
  .topbar,.no-print{display:none!important;}
  body{background:#fff;}
  .card{box-shadow:none;border:1px solid #ccc;}
}

.print-only-case{display:none;}
@media print{
  @page{size:A4 portrait;margin:10mm;}
  .screen-only-case{display:none!important;}
  .print-only-case{display:block!important;}
  .ps-header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid #1c2530;padding-bottom:6px;margin-bottom:8px;}
  .ps-brand{font-family:'Arial',sans-serif;font-weight:700;font-size:12px;}
  .ps-title{font-family:'Arial',sans-serif;font-size:11px;font-weight:700;}
  .ps-status{font-weight:600;font-size:9px;color:#555;margin-left:8px;text-transform:uppercase;}
  .ps-kv{width:100%;border-collapse:collapse;margin-bottom:6px;font-size:9px;}
  .ps-kv th{width:110px;text-align:left;font-weight:700;color:#555;padding:2px 6px 2px 0;vertical-align:top;white-space:nowrap;}
  .ps-kv td{padding:2px 10px 2px 0;vertical-align:top;}
  .ps-section-title{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:8px 0 3px;border-bottom:1px solid #999;padding-bottom:2px;}
  .ps-schedule{width:100%;border-collapse:collapse;font-size:8.5px;margin-bottom:6px;}
  .ps-schedule th{text-align:left;border-bottom:1px solid #999;padding:2px 6px;font-weight:700;}
  .ps-schedule td{padding:2px 6px;border-bottom:1px solid #eee;}
  .ps-recon{font-size:9px;margin-bottom:6px;}
  .ps-checklist{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:8.5px;margin-bottom:6px;}
  .ps-check{color:#999;}
  .ps-check.done{color:#1c2530;font-weight:600;}
  .ps-notes{font-size:8.5px;white-space:pre-wrap;border:1px solid #ddd;padding:6px;}
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* =========================================================
   YOCHARTER — FILE MANAGER
   Single-file client-side application. All data kept in
   memory for the session; use Export / Import to persist
   between sessions (and best-effort local autosave).
   ========================================================= */

/* ---------------- state ---------------- */
let STATE = {
  cases: [],
  feedback: [],
  feedbackSync: {formLink:'', endpointUrl:'', secretKey:'', lastSyncedAt:''},
  view: { tab: 'dashboard', caseId: null }
};
let nextCaseSeq = 1;
const JOTFORM_URL = 'https://form.jotform.com/wciyachts/your-luxury-charter-experience'; // fallback shown until a custom link is set below

/* ---------------- multi-user mode (optional) ----------------
   Fill these in to turn this file into a shared, login-protected app for
   you and a colleague — both of you will read and write the SAME data,
   stored in Supabase instead of just this browser's local storage.
   Leave them as-is (with "YOUR-PROJECT-REF") to keep using this file
   exactly as before, purely local to this browser, no login needed. */
const SUPABASE_URL = 'https://qwboxtgjdvipnwgnousd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3Ym94dGdqZHZpcG53Z25vdXNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NDM5ODMsImV4cCI6MjEwMzUxOTk4M30.FAZjsntbrpnLmBvRH6fDyCNV0-t02qREPjsDe2RWwLQ';
const MULTIUSER_ENABLED = SUPABASE_URL.indexOf('YOUR-PROJECT-REF') === -1 && !!window.supabase;
const supabaseClient = MULTIUSER_ENABLED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let currentUser = null;
let serverPushTimer = null;
let feedbackSettingsOpen = false; // per-session UI toggle, not persisted

const STORAGE_KEY = 'yocharter_manager_data_v1';

function tryLoadLocal(){
  try{
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.cases)){
        STATE.cases = normalizeCases(parsed.cases);
        nextCaseSeq = parsed.nextCaseSeq || (STATE.cases.length + 1);
      }
      if(parsed && Array.isArray(parsed.feedback)){
        STATE.feedback = normalizeFeedbackList(parsed.feedback);
      }
      if(parsed && parsed.feedbackSync && typeof parsed.feedbackSync==='object'){
        STATE.feedbackSync = Object.assign({formLink:'', endpointUrl:'', secretKey:'', lastSyncedAt:''}, parsed.feedbackSync);
      }
    }
  }catch(e){ /* storage unavailable — session-only mode */ }
}
function tryPersistLocal(){
  try{
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify({cases:STATE.cases,nextCaseSeq,feedback:STATE.feedback,feedbackSync:STATE.feedbackSync}));
  }catch(e){ /* ignore — export/import remains the reliable path */ }
  schedulePushToServer();
}

/* ---------------- multi-user sync (Supabase) ---------------- */
function schedulePushToServer(){
  if(!MULTIUSER_ENABLED || !currentUser) return;
  clearTimeout(serverPushTimer);
  serverPushTimer = setTimeout(pushToServer, 900); // debounced so rapid edits don't hammer the server
}
async function pushToServer(){
  if(!MULTIUSER_ENABLED || !currentUser) return;
  try{
    /* The Supabase service_role key (feedbackSync.secretKey) never leaves
       this device: it grants full read/write access bypassing all security
       rules, so it must not end up stored in the shared workspace row where
       any logged-in teammate could read it back out. */
    const feedbackSyncToShare = Object.assign({}, STATE.feedbackSync, {secretKey:''});
    const payload = {cases:STATE.cases, nextCaseSeq, feedback:STATE.feedback, feedbackSync:feedbackSyncToShare};
    const { error } = await supabaseClient.from('workspace').update({data: payload}).eq('id','default');
    if(error) throw error;
  }catch(e){
    console.error('Sync to server failed', e);
    showToast('Could not sync to server — your changes are saved locally only for now.', 'error');
  }
}
async function loadFromServer(){
  if(!MULTIUSER_ENABLED) return false;
  try{
    const { data, error } = await supabaseClient.from('workspace').select('data').eq('id','default').single();
    if(error) throw error;
    const parsed = data && data.data;
    if(parsed && Array.isArray(parsed.cases)){
      STATE.cases = normalizeCases(parsed.cases);
      nextCaseSeq = parsed.nextCaseSeq || (STATE.cases.length + 1);
    }
    if(parsed && Array.isArray(parsed.feedback)){
      STATE.feedback = normalizeFeedbackList(parsed.feedback);
    }
    if(parsed && parsed.feedbackSync && typeof parsed.feedbackSync==='object'){
      const keepLocalSecretKey = STATE.feedbackSync.secretKey; // never overwritten by a sync — it's kept per-device only
      STATE.feedbackSync = Object.assign({formLink:'', endpointUrl:'', secretKey:'', lastSyncedAt:''}, parsed.feedbackSync, {secretKey: keepLocalSecretKey});
    }
    return true;
  }catch(e){
    console.error('Load from server failed', e);
    showToast('Could not load from server — showing your last locally-saved data.', 'error');
    return false;
  }
}
function subscribeToServerChanges(){
  if(!MULTIUSER_ENABLED) return;
  supabaseClient
    .channel('workspace-changes')
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'workspace', filter:'id=eq.default'}, ()=>{
      // Don't yank the page out from under someone mid-keystroke — they'll pick up
      // the colleague's changes automatically as soon as they next save something,
      // since every save reloads-then-merges via the normal render cycle anyway.
      const active = document.activeElement;
      const isTyping = active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
      if(isTyping) return;
      loadFromServer().then(ok=>{ if(ok) render(); });
    })
    .subscribe();
}

/* ---------------- helpers ---------------- */
function uid(){ return 'c' + Math.random().toString(36).slice(2,10); }
/* Local-date-safe "YYYY-MM-DD" formatter. Deliberately NOT using
   date.toISOString() here: that converts through UTC, and for any positive
   UTC-offset timezone (e.g. Italy) a local midnight can roll back to the
   previous day once converted — silently shifting every date in the app
   back by one. Reading the local Y/M/D components directly avoids that. */
function toISODate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtMoney(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return '€' + Number(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function addDays(dateStr, days){
  if(!dateStr) return '';
  const dt = new Date(dateStr+'T00:00:00');
  dt.setDate(dt.getDate()+days);
  return toISODate(dt);
}
function subMonths(dateStr, months){
  if(!dateStr) return '';
  const dt = new Date(dateStr+'T00:00:00');
  dt.setMonth(dt.getMonth()-months);
  return toISODate(dt);
}
function daysFromToday(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const dt = new Date(dateStr+'T00:00:00');
  return Math.round((dt-today)/86400000);
}
/* Native date/time pickers get closed by any DOM re-render while they're open,
   and re-rendering mid-keystroke on a partially-typed date wipes what was
   typed. So date/time fields commit on 'change' (once a full value is picked)
   rather than on every 'input'. Checkboxes/selects also use 'change'. */
function liveEventFor(el){
  if(el.tagName==='SELECT') return 'change';
  if(el.tagName==='INPUT' && ['date','time','checkbox','radio'].includes(el.type)) return 'change';
  return 'input';
}
/* Only text-like inputs (and textarea) support selectionStart/selectionEnd —
   number/date/time throw if you touch it. Reading/restoring it on those types
   is what caused digits to reverse while typing (cursor got force-reset to
   position 0 on every keystroke's re-render). */
function supportsSelectionRange(el){
  if(!el) return false;
  if(el.tagName==='TEXTAREA') return true;
  return el.tagName==='INPUT' && ['text','search','url','tel','password'].includes(el.type);
}

function esc(s){
  return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Fills in any field missing from an older/incomplete case record (e.g. saved
   by an earlier version of this app) with a safe default, without touching
   any value that is already present. Prevents a stale record from breaking
   the detail view when opened. */
function normalizeCase(raw){
  const base = newCase();
  const c = Object.assign({}, base, raw||{});
  c.id = raw && raw.id ? raw.id : base.id;
  c.attachments = Object.assign({}, base.attachments, (raw&&raw.attachments)||{});
  c.attachments.addendums = Array.isArray(c.attachments.addendums) ? c.attachments.addendums : [];
  c.customPayments = Array.isArray(raw && raw.customPayments) ? raw.customPayments : [];
  c.hiddenPayments = (raw && typeof raw.hiddenPayments==='object' && raw.hiddenPayments) ? raw.hiddenPayments : {};
  c.paymentOrder = Array.isArray(raw && raw.paymentOrder) ? raw.paymentOrder : [];
  c.customPayments = (c.customPayments||[]).map(cp=> cp.id ? cp : Object.assign({}, cp, {id: uid()}));
  c.paymentOverrides = (raw && typeof raw.paymentOverrides==='object' && raw.paymentOverrides) ? raw.paymentOverrides : {};
  c.reconciliation = Object.assign({}, base.reconciliation, (raw&&raw.reconciliation)||{});
  c.payments = (raw && typeof raw.payments==='object' && raw.payments) ? raw.payments : {};
  c.type = (raw && raw.type==='sale') ? 'sale' : 'charter';
  c.saleDueDates = (raw && typeof raw.saleDueDates==='object' && raw.saleDueDates) ? raw.saleDueDates : {};
  return c;
}
function normalizeCases(list){
  return (Array.isArray(list)?list:[]).map(normalizeCase);
}

/* ---- derived financial figures ---- */
const STATUS_META = {
  negotiation: {label:'In Negotiation', cls:'badge-idle', dot:'#9aa1a9'},
  option:      {label:'Option', cls:'badge-warn', dot:'#d98b2b'},
  contract:    {label:'Under Contract', cls:'badge-retail', dot:'#3b6ea5'},
  confirmed:   {label:'Confirmed', cls:'badge-ok', dot:'#3d6b4c'},
  in_progress: {label:'Charter In Progress', cls:'badge-progress', dot:'#c9a227'},
  completed:   {label:'Charter Completed', cls:'badge-central', dot:'#4d7a78'},
  closed:      {label:'Closed', cls:'badge-idle', dot:'#1c2530'}
};
const STATUS_ORDER = {negotiation:0, option:1, contract:2, confirmed:3, in_progress:4, completed:5, closed:6};
/* The person only ever sets one of: negotiation / option / contract / confirmed / closed.
   "Charter In Progress" and "Charter Completed" are never chosen — they're derived
   automatically from "Confirmed" once today's date falls within, or after, the
   charter dates. Closing is always a deliberate action (see isReadyToClose). */
function getEffectivePhase(c){
  if(c.status==='closed') return 'closed';
  if(c.status==='confirmed'){
    if(c.charterStartDate && c.charterEndDate){
      const today = new Date(); today.setHours(0,0,0,0);
      const start = new Date(c.charterStartDate+'T00:00:00');
      const end = new Date(c.charterEndDate+'T00:00:00');
      if(today > end) return 'completed';
      if(today >= start) return 'in_progress';
    }
    return 'confirmed';
  }
  return c.status || 'negotiation';
}
/* Surfaced as a gentle nudge, not an automatic transition: the charter is over,
   every payment on the schedule is marked paid, and the incoming/outgoing
   ledger balances (or a reconciliation note has been recorded to justify why not). */
function isReadyToClose(c){
  if(getEffectivePhase(c)!=='completed') return false;
  const schedule = buildPaymentSchedule(c);
  const allPaid = schedule.every(p=>paymentStatus(c,p.key).status==='paid') &&
                  c.customPayments.every(cp=>cp.status==='paid');
  if(!allPaid) return false;
  const ledger = buildLedger(c);
  return Math.abs(ledger.diff) < 0.005;
}

function calc(c){
  const rate = num(c.charterRate);
  const vatAmt = c.vatOverride!==null && c.vatOverride!=='' ? num(c.vatOverride) : rate*num(c.vatPct)/100;
  const apaAmt = c.apaOverride!==null && c.apaOverride!=='' ? num(c.apaOverride) : rate*num(c.apaPct)/100;
  const delivery = num(c.deliveryFee);
  const retailComm = c.retailCommissionOverride!==null && c.retailCommissionOverride!=='' ? num(c.retailCommissionOverride) : rate*num(c.retailCommissionPct)/100;
  const caComm = c.caCommissionOverride!==null && c.caCommissionOverride!=='' ? num(c.caCommissionOverride) : rate*num(c.caCommissionPct)/100;
  return {rate,vatAmt,apaAmt,delivery,retailComm,caComm};
}

/* ---- payment schedule generation ----
   Order confirmed by the user:
   1. Client Deposit
   2. Our Commission Payment
   3. Client Balance
   4. CA Deposit (retail only)
   5. CA Balance (retail only)
   6. Owner Payment — Charter Start (central/stakeholder only)
   7. Owner Payment — APA + Delivery (central/stakeholder only)
   8. Owner Balance (central/stakeholder only)
   9. APA Refund
   10. VAT to Shipping Agency
*/
function buildScheduleItemsCharter(c){
  const {rate,vatAmt,apaAmt,delivery,retailComm,caComm} = calc(c);
  const isRetail = c.role==='retail';
  const depositDue = addDays(c.contractSignDate, 5);
  const balanceDue = subMonths(c.charterStartDate, 1);
  const list = [];

  /* --- cascading shortfall logic ---
     If the client's actual Deposit falls short of what was expected, the
     Client Balance's preset/expected amount absorbs that shortfall (so the
     total collected still matches). If the Balance is ALSO left at (or
     under) that adjusted figure — i.e. the shortfall is still not made up —
     the remainder is deducted from whichever payment carries the APA
     onward (APA + Delivery to the Owner when we're the Central Agent, or
     the Balance forwarded to the Central Agent when we're the Retail
     Broker), since that's the money that's actually missing overall. */
  const overrides = c.paymentOverrides || {};
  const overrideAmount = key => {
    const ov = overrides[key];
    return (ov && ov.amount!=='' && ov.amount!==undefined && ov.amount!==null) ? num(ov.amount) : null;
  };
  const depositExpected = isRetail ? rate*0.5 : (rate*0.5 - retailComm);
  const depositActual = overrideAmount('client_deposit');
  const depositShortfall = depositActual!==null ? (depositExpected - depositActual) : 0;

  const balanceBaseExpected = rate*0.5 + vatAmt + apaAmt + delivery;
  const balanceExpected = balanceBaseExpected + depositShortfall;
  const balanceActual = overrideAmount('client_balance');
  const balanceShortfall = balanceActual!==null ? (balanceExpected - balanceActual) : 0;

  const depositCascadeNote = depositShortfall!==0
    ? `Client Deposit is ${fmtMoney(Math.abs(depositShortfall))} ${depositShortfall>0?'short':'over'} — added to Client Balance below`
    : null;
  const balanceCascadeNote = depositShortfall!==0
    ? `Includes the ${fmtMoney(Math.abs(depositShortfall))} ${depositShortfall>0?'shortfall':'overpayment'} carried over from Client Deposit (base amount would be ${fmtMoney(balanceBaseExpected)})`
    : null;
  const apaCascadeNote = balanceShortfall!==0
    ? `Reduced by ${fmtMoney(Math.abs(balanceShortfall))} — the Client Balance is still ${balanceShortfall>0?'short':'over'} by that amount`
    : null;

  list.push({
    key:'client_deposit', label:'Client Deposit', party:'From Client',
    amount: depositExpected,
    due: depositDue,
    note: isRetail ? '50% of Charter Rate' : '50% of Charter Rate less Retail Broker commission',
    cascadeNote: depositCascadeNote,
    always:true, direction:'in', ledger:true
  });
  list.push({
    key:'our_commission', label:'Our Commission', party: isRetail ? 'Retail Broker fee' : 'Central Agent fee',
    amount: isRetail ? retailComm : caComm,
    due: depositDue,
    note:'Due when client deposit is received',
    always:true, direction:'out', ledger:true
  });
  list.push({
    key:'ca_deposit', label:'Payment to Central Agent — Deposit', party:'To Central Agent',
    amount: rate*0.5 - retailComm,
    due: depositDue,
    note:'50% Charter Rate less our Retail Broker commission',
    visible: isRetail, direction:'out', ledger:true
  });
  list.push({
    key:'client_balance', label:'Client Balance', party:'From Client',
    amount: balanceExpected,
    due: balanceDue,
    note:'50% Charter Rate + VAT + APA + Delivery',
    cascadeNote: balanceCascadeNote,
    always:true, direction:'in', ledger:true
  });
  list.push({
    key:'ca_balance', label:'Payment to Central Agent — Balance', party:'To Central Agent',
    amount: balanceExpected,
    due: balanceDue,
    note:'50% Charter Rate + VAT + APA + Delivery',
    cascadeNote: isRetail ? balanceCascadeNote : null,
    visible: isRetail, direction:'out', ledger:true
  });
  list.push({
    key:'owner_apa_delivery', label:'APA + Delivery', party:'To Owner',
    amount: (apaAmt + delivery) - (!isRetail ? balanceShortfall : 0),
    due: balanceDue,
    note:'Due on receipt of client balance',
    cascadeNote: !isRetail ? apaCascadeNote : null,
    visible: !isRetail, direction:'out', ledger:true
  });
  list.push({
    key:'owner_start', label:'First to Owner — Charter Start', party:'To Owner',
    amount: rate*0.5 - (retailComm + caComm),
    due: c.charterStartDate,
    note:'50% Charter Rate less both brokers\' commissions',
    visible: !isRetail, direction:'out', ledger:true
  });
  list.push({
    key:'owner_balance', label:'Balance to Owner', party:'To Owner',
    amount: rate*0.5 + vatAmt,
    due: c.charterEndDate,
    note:'50% Charter Rate + VAT — due on charter end date',
    visible: !isRetail, direction:'out', ledger:true
  });
  list.push({
    key:'crew_tip_received', label:'Crew Tip — Received from Client', party:'From Client',
    amount: c.crewTipReceivedAmount!=='' ? num(c.crewTipReceivedAmount) : null,
    due: c.charterEndDate,
    note:'Enter amount once confirmed with client',
    always:true, manualAmount:true, manualField:'crewTipReceivedAmount', direction:'in', ledger:true
  });
  list.push({
    key:'crew_tip_forward', label:'Crew Tip — Forwarded to Crew', party:'To Crew',
    amount: c.crewTipForwardAmount!=='' ? num(c.crewTipForwardAmount) : null,
    due: c.charterEndDate,
    note:'Send to crew on charter end',
    always:true, manualAmount:true, manualField:'crewTipForwardAmount', direction:'out', ledger:true
  });
  list.push({
    key:'apa_refund_in', label:'APA Refund — Received from Owner/Boat', party:'From Owner',
    amount: c.apaRefundInAmount!=='' ? num(c.apaRefundInAmount) : null,
    due: addDays(c.charterEndDate, 10),
    note:'Enter final amount once owner\'s APA account is closed',
    always:true, manualAmount:true, manualField:'apaRefundInAmount', direction:'in', ledger:true
  });
  list.push({
    key:'apa_refund_out', label:'APA Refund — Returned to Client', party:'To Client',
    amount: c.apaRefundOutAmount!=='' ? num(c.apaRefundOutAmount) : null,
    due: addDays(c.charterEndDate, 10),
    note:'Unused APA balance returned to the client',
    always:true, manualAmount:true, manualField:'apaRefundOutAmount', direction:'out', ledger:true
  });
  list.push({
    key:'vat_agency', label:'VAT to Shipping Agency', party:'To Shipping Agency',
    amount: vatAmt,
    due: addDays(c.charterEndDate, 5),
    note:'Preset to total VAT',
    always:true, direction:'out', ledger:true
  });
  return list;
}

function buildScheduleItemsSale(c){
  const {rate, retailComm, caComm} = calc(c);
  const isRetail = c.role==='retail';

  const depositFrac = depositPct/100;

    amount: isRetail ? retailComm : caComm,

    always:true, direction:'out', ledger:true
  });
  list.push({
    key:'ca_deposit', label:'Payment to Central Agent — Deposit', party:'To Central Agent',

    due: dueFor('ca_deposit'), manualDue:true,
    note:`${depositLabel} less our Retail Broker commission`,

  });
  list.push({

    always:true, direction:'in', ledger:true
  });
  list.push({
    key:'ca_balance', label:'Payment to Central Agent — Balance', party:'To Central Agent',
    amount: rate*balanceFrac,
    due: dueFor('ca_balance'), manualDue:true,
    note: balanceLabel,
    visible: isRetail, direction:'out', ledger:true
  });
  list.push({
    key:'seller_deposit', label:'First to Seller — Deposit', party:'To Seller',
    amount: rate*depositFrac - (retailComm + caComm),
    due: dueFor('seller_deposit'), manualDue:true,
    note:`${depositLabel} less both brokers' commissions`,
    visible: !isRetail, direction:'out', ledger:true
  });
  list.push({
    key:'seller_balance', label:'Balance to Seller', party:'To Seller',
    amount: rate*balanceFrac,
    due: dueFor('seller_balance'), manualDue:true,
    note: balanceLabel,
    visible: !isRetail, direction:'out', ledger:true
  });
  return list;
}

function buildRawSchedule(c){
  const list = c.type==='sale' ? buildScheduleItemsSale(c) : buildScheduleItemsCharter(c);

  const overrides = c.paymentOverrides || {};
  list.forEach(p=>{
    p.expectedAmount = p.amount;
    const ov = overrides[p.key];
    if(!p.manualAmount && ov && ov.amount!=='' && ov.amount!==undefined && ov.amount!==null){
      p.amount = num(ov.amount);
      p.amountOverridden = true;
    }
    p.rowNote = ov ? (ov.note||'') : '';
  });

  return list.filter(p=>p.always || p.visible);
}

/* schedule actually shown/counted for this file — excludes rows the user has hidden */
function buildPaymentSchedule(c){
  const hidden = c.hiddenPayments || {};
  return buildRawSchedule(c).filter(p=>!hidden[p.key]);
}
/* preset rows the user has hidden from this specific file, so they can be listed & restored */
function getHiddenPresetPayments(c){
  const hidden = c.hiddenPayments || {};
  return buildRawSchedule(c).filter(p=>hidden[p.key]);
}

/* Preset payments and extra (custom) payments are merged into a single
   orderable list so an extra payment can be dragged anywhere among the
   preset ones, not just reordered against other extra payments.
   c.paymentOrder stores composite ids: "fixed:<key>" or "custom:<id>". */
function getUnifiedScheduleRows(c){
  const fixed = buildPaymentSchedule(c).map(p=>({type:'fixed', id:'fixed:'+p.key, data:p}));
  const custom = c.customPayments.map((cp,idx)=>({type:'custom', id:'custom:'+cp.id, data:cp, idx}));
  const all = [...fixed, ...custom];
  const byId = {};
  all.forEach(r=>{ byId[r.id] = r; });
  const resolve = oid => byId[oid] || byId['fixed:'+oid]; // 'fixed:' fallback supports order data saved before unification
  const order = Array.isArray(c.paymentOrder) ? c.paymentOrder : [];
  const rows = [];
  const used = new Set();
  order.forEach(oid=>{
    const r = resolve(oid);
    if(r && !used.has(r.id)){ rows.push(r); used.add(r.id); }
  });
  all.forEach(r=>{ if(!used.has(r.id)){ rows.push(r); used.add(r.id); } });
  return rows;
}

/* ---- ledger: incoming vs outgoing reconciliation ---- */
function buildLedger(c){
  const schedule = buildPaymentSchedule(c).filter(p=>p.ledger);
  const rows = [];
  schedule.forEach(p=>{
    const st = paymentStatus(c,p.key);
    rows.push({
      description: p.label, reason: p.rowNote ? p.rowNote : p.note, direction: p.direction,
      amount: p.amount, due: p.due, status: st.status
    });
  });
  c.customPayments.forEach(cp=>{
    rows.push({
      description: cp.description || 'Extra payment', reason: cp.reason, direction: cp.direction,
      amount: cp.amount!=='' ? num(cp.amount) : null, due: cp.due, status: cp.status
    });
  });
  const recon = c.reconciliation;
  if(recon && recon.amount!=='' && num(recon.amount)>0){
    rows.push({
      description:'Reconciliation Adjustment', reason: recon.note || 'Manually entered to balance the ledger',
      direction: recon.direction, amount: num(recon.amount), due:'', status:'n/a', isRecon:true
    });
  }
  const totalIn = rows.filter(r=>r.direction==='in').reduce((s,r)=>s+(r.amount||0),0);
  const totalOut = rows.filter(r=>r.direction==='out').reduce((s,r)=>s+(r.amount||0),0);
  return {rows, totalIn, totalOut, diff: totalIn-totalOut};
}

function paymentStatus(c, key){
  return c.payments[key] || {status:'pending', paidDate:''};
}
function paymentUrgency(due, status){
  if(status==='paid') return 'ok';
  if(!due) return 'idle';
  const d = daysFromToday(due);
  if(d===null) return 'idle';
  if(d<0) return 'danger';
  if(d<=7) return 'warn';
  return 'idle';
}

/* ---- cases list ---- */
function sortCases(cases, field, dir){
  const mul = dir==='asc' ? 1 : -1;
  return cases.slice().sort((a,b)=>{
    let av, bv;
    switch(field){
      case 'caseNumber': av=(a.caseNumber||'').toLowerCase(); bv=(b.caseNumber||'').toLowerCase(); break;
      case 'clientName': av=(a.clientName||'').toLowerCase(); bv=(b.clientName||'').toLowerCase(); break;
      case 'yachtName': av=(a.yachtName||'').toLowerCase(); bv=(b.yachtName||'').toLowerCase(); break;
      case 'role': av=a.role||''; bv=b.role||''; break;
      case 'charterEndDate': av=a.charterEndDate||''; bv=b.charterEndDate||''; break;
      case 'personInCharge': av=(a.personInCharge||'').toLowerCase(); bv=(b.personInCharge||'').toLowerCase(); break;
      case 'payments': av=paymentsOverdueCount(a); bv=paymentsOverdueCount(b); break;
      case 'status': av=STATUS_ORDER[getEffectivePhase(a)]??0; bv=STATUS_ORDER[getEffectivePhase(b)]??0; break;
      case 'charterStartDate':
      default: av=a.charterStartDate||''; bv=b.charterStartDate||''; break;
    }
    if(av<bv) return -1*mul;
    if(av>bv) return 1*mul;
    return 0;
  });
}
function paymentsOverdueCount(c){
  try{
    const sched = buildPaymentSchedule(c);
    return sched.filter(p=>paymentStatus(c,p.key).status!=='paid' && daysFromToday(p.due)!==null && daysFromToday(p.due)<0).length;
  }catch(e){ return -1; }
}

/* ---- booking calendar ---- */
const YACHT_COLOR_PALETTE = ['#3b6ea5','#4f8a41','#c9a227','#a13f2e','#6b4fa5','#2f8f7f','#b5588c','#7a8b3f','#3f5c8a','#a5763b','#5a6a76','#8a5a3f'];
function colorForYacht(name){
  if(!name) return '#8a97a3';
  let hash = 0;
  for(let i=0;i<name.length;i++){ hash = (hash*31 + name.charCodeAt(i)) >>> 0; }
  return YACHT_COLOR_PALETTE[hash % YACHT_COLOR_PALETTE.length];
}
function dateStr(d){ return toISODate(d); }
function dayDiffFromWeekStart(weekStartDate, iso){
  const d = new Date(iso+'T00:00:00');
  return Math.round((d - weekStartDate) / 86400000);
}
function buildCalendarWeeks(year, month){
  const monthStart = new Date(year, month, 1);
  const monthEnd = new Date(year, month+1, 0);
  const startWeekday = (monthStart.getDay()+6)%7; // Monday=0
  const daysInMonth = monthEnd.getDate();
  const gridStart = new Date(year, month, 1 - startWeekday);
  const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
  const weeks = [];
  for(let w=0; w<totalCells/7; w++){
    const days = [];
    for(let d=0; d<7; d++){
      days.push(new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + w*7 + d));
    }
    weeks.push(days);
  }
  return weeks;
}
function assignCalendarLanes(weekCases, weekStartDate, clipStart, clipEnd){
  const sorted = weekCases.slice().sort((a,b)=> (a.charterStartDate||'').localeCompare(b.charterStartDate||'') || (a.caseNumber||'').localeCompare(b.caseNumber||''));
  const lanes = []; // lane -> last occupied column
  const placed = [];
  sorted.forEach(c=>{
    const effStart = c.charterStartDate > clipStart ? c.charterStartDate : clipStart;
    const effEnd = c.charterEndDate < clipEnd ? c.charterEndDate : clipEnd;
    const startCol = Math.max(0, dayDiffFromWeekStart(weekStartDate, effStart));
    const endCol = Math.min(6, dayDiffFromWeekStart(weekStartDate, effEnd));
    let lane = lanes.findIndex(endC => endC < startCol);
    if(lane === -1){ lane = lanes.length; lanes.push(endCol); }
    else lanes[lane] = endCol;
    placed.push({c, startCol, endCol, lane, effStart, effEnd});
  });
  return {placed, laneCount: Math.max(lanes.length,1)};
}
function renderCalendarMonthBlock(year, month, cases, todayStr){
  const monthStart = new Date(year, month, 1);
  const monthEnd = new Date(year, month+1, 0);
  const monthStartStr = dateStr(monthStart);
  const monthEndStr = dateStr(monthEnd);
  const monthLabel = monthStart.toLocaleDateString('en-GB', {month:'long', year:'numeric'});
  const weekdayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const weeks = buildCalendarWeeks(year, month);

  const weeksHtml = weeks.map(days=>{
    const weekStartDate = days[0];
    const weekStartStr = dateStr(days[0]);
    const weekEndStr = dateStr(days[6]);
    // Clip to this month only — the leading/trailing padding days belong
    // visually to the adjacent month's own block, so a charter shouldn't
    // be drawn across them here too (that's what made bars look longer
    // than they really are when two months are shown stacked).
    const clipStart = weekStartStr > monthStartStr ? weekStartStr : monthStartStr;
    const clipEnd = weekEndStr < monthEndStr ? weekEndStr : monthEndStr;
    const weekCases = clipStart <= clipEnd
      ? cases.filter(c => c.charterStartDate <= clipEnd && c.charterEndDate >= clipStart)
      : [];
    const {placed, laneCount} = assignCalendarLanes(weekCases, weekStartDate, clipStart, clipEnd);

    const dayNumsHtml = days.map(d=>{
      const inMonth = d.getMonth()===month;
      const isToday = dateStr(d)===todayStr;
      return `<div class="cal-daycell ${inMonth?'':'cal-daycell-out'} ${isToday?'cal-daycell-today':''}">${inMonth?d.getDate():''}</div>`;
    }).join('');

    const barsHtml = placed.map(p=>{
      const c = p.c;
      const color = colorForYacht(c.yachtName);
      const continuesBefore = c.charterStartDate < p.effStart;
      const continuesAfter = c.charterEndDate > p.effEnd;
      const label = [c.caseNumber, c.yachtName, c.clientName].filter(Boolean).join(' · ') || 'Untitled charter';
      const radius = `border-top-left-radius:${continuesBefore?'0':'4px'};border-bottom-left-radius:${continuesBefore?'0':'4px'};border-top-right-radius:${continuesAfter?'0':'4px'};border-bottom-right-radius:${continuesAfter?'0':'4px'};`;
      return `<div class="cal-bar" data-open-case="${c.id}" style="grid-column:${p.startCol+1} / span ${p.endCol-p.startCol+1}; grid-row:${p.lane+1}; background:${color}; ${radius}" title="${esc(label)}">
        <span class="cal-bar-label">${continuesBefore?'← ':''}${esc(label)}${continuesAfter?' →':''}</span>
      </div>`;
    }).join('');

    return `<div class="cal-week">
      <div class="cal-week-daynums">${dayNumsHtml}</div>
      <div class="cal-week-bars" style="grid-template-rows:repeat(${laneCount}, 22px);">${barsHtml}</div>
    </div>`;
  }).join('');

  return `
    <div class="cal-month-label">${monthLabel}</div>
    <div class="cal-grid-head">
      ${weekdayLabels.map(w=>`<div class="cal-headcell">${w}</div>`).join('')}
    </div>
    ${weeksHtml}
  `;
}
function renderCalendar(){
  const now = new Date();
  const year = STATE.view.calYear!==undefined ? STATE.view.calYear : now.getFullYear();
  const month = STATE.view.calMonth!==undefined ? STATE.view.calMonth : now.getMonth(); // 0-11
  const yachtFilter = STATE.view.calYachtFilter || '';
  const todayStr = dateStr(now);

  const activeYachtNames = Array.from(new Set(
    STATE.cases.filter(c => getEffectivePhase(c)!=='closed' && c.yachtName).map(c=>c.yachtName)
  )).sort();

  const cases = STATE.cases.filter(c=> c.charterStartDate && c.charterEndDate && (!yachtFilter || c.yachtName===yachtFilter));

  let nextMonth = month+1, nextYear = year;
  if(nextMonth>11){ nextMonth=0; nextYear+=1; }

  return `
    <div class="search-bar no-print" style="align-items:center;">
      <button class="btn btn-ghost btn-sm" data-cal-nav="prev">← Prev</button>
      <button class="btn btn-ghost btn-sm" data-cal-nav="today">Today</button>
      <button class="btn btn-ghost btn-sm" data-cal-nav="next">Next →</button>
      <select id="cal-filter-yacht" style="margin-left:auto;">
        <option value="">All yachts</option>
        ${activeYachtNames.map(y=>`<option value="${esc(y)}" ${yachtFilter===y?'selected':''}>${esc(y)}</option>`).join('')}
      </select>
    </div>
    <div class="card">
      <div class="card-body" style="padding:14px;">
        ${renderCalendarMonthBlock(year, month, cases, todayStr)}
      </div>
    </div>

/* ---- statistics ---- */
function yearFromCaseNumber(caseNumber){
  const m = (caseNumber||'').trim().match(/(\d{4})\s*$/);
  return m ? m[1] : null;
}
function renderStatistics(){
  const groups = {}; // year -> rows[]
  let noYear = [];
  STATE.cases.forEach(c=>{
    const {rate, vatAmt, apaAmt, delivery, retailComm, caComm} = calc(c);
    const totalForClient = rate + vatAmt + apaAmt + delivery;
    const row = {
      id: c.id, caseNumber: c.caseNumber, yachtName: c.yachtName, role: c.role,
      charterRate: rate, totalForClient,
      retailCommission: c.role==='retail' ? retailComm : 0,
      centralCommission: c.role==='central' ? caComm : 0
    };
    const year = yearFromCaseNumber(c.caseNumber);
    if(year){ (groups[year] = groups[year]||[]).push(row); }
    else noYear.push(row);
  });
  const years = Object.keys(groups).sort((a,b)=> b.localeCompare(a));

  if(STATE.cases.length===0){
    return `<div class="card"><div class="card-body">${emptyState('No data yet','Statistics will appear here once you have charter files with a case number ending in a year, e.g. 000-2026.')}</div></div>`;
  }

  const sumRows = rows => rows.reduce((s,r)=>({
    charterRate: s.charterRate + (r.charterRate||0),
    totalForClient: s.totalForClient + (r.totalForClient||0),
    retailCommission: s.retailCommission + (r.retailCommission||0),
    centralCommission: s.centralCommission + (r.centralCommission||0)
  }), {charterRate:0, totalForClient:0, retailCommission:0, centralCommission:0});

  const grand = sumRows(Object.values(groups).flat().concat(noYear));

  const renderYearTable = (label, rows) => {
    rows = rows.slice().sort((a,b)=> (a.caseNumber||'').localeCompare(b.caseNumber||''));
    const totals = sumRows(rows);
    return `
    <div class="card">
      <div class="card-head"><h2><span class="eyebrow">Year</span>&nbsp; ${esc(label)}</h2><span class="muted" style="font-size:12px;">${rows.length} charter file${rows.length===1?'':'s'}</span></div>
      <div class="card-body" style="padding:0;">
        <table>
          <thead><tr>
            <th>Case #</th><th>Yacht</th><th>Role</th>
            <th style="text-align:right;">Charter Rate</th>
            <th style="text-align:right;">Total Charter (Client)</th>
            <th style="text-align:right;">Retail Broker Commission</th>
            <th style="text-align:right;">Central Agent Commission</th>
          </tr></thead>
          <tbody>
            ${rows.map(r=>`<tr class="clickable" data-open-case="${r.id}">
              <td class="mono">${r.caseNumber?esc(r.caseNumber):'<span class="muted">—</span>'}</td>
              <td>${esc(r.yachtName)||'<span class="muted">—</span>'}</td>
              <td>${r.role==='retail'?'<span class="badge badge-retail">Retail Broker</span>':'<span class="badge badge-central">Central Agent</span>'}</td>
              <td style="text-align:right;" class="amount">${fmtMoney(r.charterRate)}</td>
              <td style="text-align:right;" class="amount">${fmtMoney(r.totalForClient)}</td>
              <td style="text-align:right;" class="amount">${r.role==='retail'?fmtMoney(r.retailCommission):'—'}</td>
              <td style="text-align:right;" class="amount">${r.role==='central'?fmtMoney(r.centralCommission):'—'}</td>
            </tr>`).join('')}
          </tbody>
          <tfoot>
            <tr>
              <td colspan="3" style="text-align:right;font-weight:700;">Year total</td>
              <td style="text-align:right;font-weight:700;" class="amount">${fmtMoney(totals.charterRate)}</td>
              <td style="text-align:right;font-weight:700;" class="amount">${fmtMoney(totals.totalForClient)}</td>
              <td style="text-align:right;font-weight:700;" class="amount">${fmtMoney(totals.retailCommission)}</td>
              <td style="text-align:right;font-weight:700;" class="amount">${fmtMoney(totals.centralCommission)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>`;
  };

  return `
    <div class="dash-grid">
      <div class="stat-card"><div class="num">${STATE.cases.length}</div><div class="lbl">Charter files</div></div>
      <div class="stat-card"><div class="num">${fmtMoney(grand.charterRate)}</div><div class="lbl">Total charter rate</div></div>
      <div class="stat-card"><div class="num">${fmtMoney(grand.retailCommission)}</div><div class="lbl">Retail Broker commission</div></div>
      <div class="stat-card"><div class="num">${fmtMoney(grand.centralCommission)}</div><div class="lbl">Central Agent commission</div></div>
    </div>
    ${years.map(y=>renderYearTable(y, groups[y])).join('')}
    ${noYear.length ? renderYearTable('No year found in case number', noYear) : ''}
  `;
}

            <option value="unpaid" ${c.saleVatPaid==='unpaid'?'selected':''}>VAT Not Paid</option>
          </select>
        </div>
        <div class="field"><label class="field-label">Deposit / Confirmatory Earnest (%)</label><input type="text" inputmode="decimal" data-f="saleDepositPct" value="${esc(c.saleDepositPct)}"></div>
      </div>` : `
      <div class="row c4">
        <div class="field"><label class="field-label">Charter Rate (€)</label><input type="text" inputmode="decimal" data-f="charterRate" data-money value="${esc(c.charterRate)}"></div>
        <div class="field"><label class="field-label">VAT %</label><input type="text" inputmode="decimal" data-f="vatPct" value="${esc(c.vatPct)}"></div>
        <div class="field"><label class="field-label">VAT Total (€) ${c.vatOverride!==null && c.vatOverride!=='' ? '<span class=\"override-flag\">· edited</span>':''}</label><input type="text" inputmode="decimal" data-f="vatOverride" data-money placeholder="${vatAmt.toFixed(2)}" value="${c.vatOverride!==null?esc(c.vatOverride):''}"></div>
        <div class="field"><label class="field-label">Delivery Fee (€)</label><input type="text" inputmode="decimal" data-f="deliveryFee" data-money value="${esc(c.deliveryFee)}" placeholder="0.00"></div>
      </div>
      <div class="row c2">
        <div class="field"><label class="field-label">APA %</label><input type="text" inputmode="decimal" data-f="apaPct" value="${esc(c.apaPct)}"></div>
        <div class="field"><label class="field-label">APA Total (€) ${c.apaOverride!==null && c.apaOverride!=='' ? '<span class=\"override-flag\">· edited</span>':''}</label><input type="text" inputmode="decimal" data-f="apaOverride" data-money placeholder="${apaAmt.toFixed(2)}" value="${c.apaOverride!==null?esc(c.apaOverride):''}"></div>
      </div>`}
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2><span class="eyebrow">Parties</span>&nbsp; Brokers & Commission</h2></div>
    <div class="card-body">
      <div class="divider-label">Retail Broker</div>
      <div class="row c4">
        <div class="field"><label class="field-label">Broker Name</label><input type="text" data-f="retailBrokerName" value="${esc(c.retailBrokerName)}"></div>
        <div class="field"><label class="field-label">Agency Name</label><input type="text" data-f="retailAgencyName" value="${esc(c.retailAgencyName)}"></div>
        <div class="field"><label class="field-label">Commission %</label><input type="text" inputmode="decimal" data-f="retailCommissionPct" value="${esc(c.retailCommissionPct)}"></div>
        <div class="field"><label class="field-label">Total ${c.retailCommissionOverride!==null && c.retailCommissionOverride!=='' ? '<span class=\"override-flag\">· edited</span>':''}</label><input type="text" inputmode="decimal" data-f="retailCommissionOverride" data-money placeholder="${retailComm.toFixed(2)}" value="${c.retailCommissionOverride!==null?esc(c.retailCommissionOverride):''}"></div>
      </div>
      <div class="divider-label">Central Agent</div>
      <div class="row c4">
        <div class="field"><label class="field-label">Broker Name</label><input type="text" data-f="caBrokerName" value="${esc(c.caBrokerName)}"></div>
        <div class="field"><label class="field-label">Agency Name</label><input type="text" data-f="caAgencyName" value="${esc(c.caAgencyName)}"></div>
        <div class="field"><label class="field-label">Commission %</label><input type="text" inputmode="decimal" data-f="caCommissionPct" value="${esc(c.caCommissionPct)}"></div>
        <div class="field"><label class="field-label">Total (€) ${c.caCommissionOverride!==null && c.caCommissionOverride!=='' ? '<span class=\"override-flag\">· edited</span>':''}</label><input type="text" inputmode="decimal" data-f="caCommissionOverride" data-money placeholder="${caComm.toFixed(2)}" value="${c.caCommissionOverride!==null?esc(c.caCommissionOverride):''}"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2><span class="eyebrow">Schedule</span>&nbsp; Payments & Reminders</h2></div>
    ${unifiedRows.some(r=>r.type==='fixed' && r.data.cascadeNote) ? `
    <div class="no-print" style="padding:12px 20px;background:var(--danger-bg);border-bottom:1px solid var(--line);color:var(--danger);font-size:12.5px;font-weight:600;">
      ⚠ A shortfall was detected and has cascaded through the payment schedule below — check the flagged rows.
    </div>` : ''}
    <div class="card-body" style="padding:0;">
      <table>
        <thead><tr><th style="width:26px;"></th><th style="width:40px;"></th><th>Payment</th><th>Direction</th><th>Due Date</th><th style="text-align:right;">Amount</th><th>Status</th><th>Paid on</th><th class="no-print"></th></tr></thead>
        <tbody>
          ${unifiedRows.map((row,i)=>{
            const badgeFor = (status, due) => {
              const urg = paymentUrgency(due, status);
              return status==='paid' ? '<span class="badge badge-ok">Paid</span>'
                   : urg==='danger' ? '<span class="badge badge-danger">Overdue</span>'
                   : urg==='warn' ? '<span class="badge badge-warn">Due soon</span>'
                   : '<span class="badge badge-idle">Pending</span>';
            };
            const moveButtons = `
                <span class="drag-handle" data-drag-id="${row.id}" title="Drag to reorder">⠿</span>
                <button class="btn btn-ghost btn-sm" style="padding:2px 5px;${i===0?'opacity:.3;cursor:default;':''}" data-move-id="${row.id}" data-move-dir="up" title="Move up" ${i===0?'disabled':''}>▲</button>
                <button class="btn btn-ghost btn-sm" style="padding:2px 5px;${i===unifiedRows.length-1?'opacity:.3;cursor:default;':''}" data-move-id="${row.id}" data-move-dir="down" title="Move down" ${i===unifiedRows.length-1?'disabled':''}>▼</button>`;

            if(row.type==='fixed'){
              const p = row.data;
              const st = paymentStatus(c,p.key);
              return `<tr data-row-id="${row.id}">
              <td><input type="checkbox" data-pay-toggle="${p.key}" ${st.status==='paid'?'checked':''}></td>
              <td class="no-print" style="white-space:nowrap;">${moveButtons}</td>
              <td>
                <strong>${esc(p.label)}</strong><div class="muted" style="font-size:11.5px;margin-top:2px;">${esc(p.note)}</div>
                ${p.cascadeNote ? `<div style="color:var(--danger);font-size:11px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:4px;">⚠ ${esc(p.cascadeNote)}</div>` : ''}
                <input type="text" data-override="note" data-override-key="${p.key}" value="${esc(p.rowNote)}" placeholder="Add a note (e.g. shortfall, adjustment)…" style="margin-top:6px;font-size:11.5px;padding:5px 8px;">
              </td>
              <td class="muted">${esc(p.party)}</td>
              <td class="mono">${p.manualDue ? `<input type="date" data-sale-due="${p.key}" value="${esc(p.due)}" style="width:150px;">` : fmtDate(p.due)}</td>
              <td style="text-align:right;">
                ${p.manualAmount
                  ? `<input type="text" inputmode="decimal" data-f="${p.manualField}" data-money style="width:120px;text-align:right;" value="${esc(c[p.manualField])}" placeholder="0.00">`
                  : `<input type="text" inputmode="decimal" data-override="amount" data-money data-override-key="${p.key}" style="width:120px;text-align:right;" value="${p.amountOverridden?esc(c.paymentOverrides[p.key].amount):''}" placeholder="${p.expectedAmount!==null&&p.expectedAmount!==undefined?p.expectedAmount.toFixed(2):'0.00'}">
                     ${p.amountOverridden ? `<div class="muted" style="font-size:10.5px;margin-top:2px;">expected ${fmtMoney(p.expectedAmount)}</div>` : ''}`}
              </td>
              <td>${badgeFor(st.status, p.due)}</td>
              <td><input type="date" data-pay-date="${p.key}" value="${esc(st.paidDate)}" style="width:150px;"></td>
              <td class="no-print"><button class="attach-remove" data-hide-payment="${p.key}" title="Remove from this file">×</button></td>
            </tr>`;
            }else{
              const cp = row.data, idx = row.idx;
              return `<tr data-row-id="${row.id}">
              <td><input type="checkbox" data-custom-pay-toggle="${idx}" ${cp.status==='paid'?'checked':''}></td>
              <td class="no-print" style="white-space:nowrap;">${moveButtons}</td>
              <td>
                <input type="text" data-custom="description" data-custom-idx="${idx}" value="${esc(cp.description)}" placeholder="Payment description" style="margin-bottom:5px;">
                <input type="text" data-custom="reason" data-custom-idx="${idx}" value="${esc(cp.reason)}" placeholder="Reason / notes" style="font-size:11.5px;">
              </td>
              <td class="muted">
                <select data-custom="direction" data-custom-idx="${idx}" style="font-size:12px;padding:4px 6px;">
                  <option value="in" ${cp.direction==='in'?'selected':''}>Incoming</option>
                  <option value="out" ${cp.direction==='out'?'selected':''}>Outgoing</option>
                </select>
              </td>
              <td><input type="date" data-custom="due" data-custom-idx="${idx}" value="${esc(cp.due)}" style="width:150px;"></td>
              <td style="text-align:right;"><input type="text" inputmode="decimal" data-custom="amount" data-money data-custom-idx="${idx}" value="${esc(cp.amount)}" placeholder="0.00" style="width:120px;text-align:right;"></td>
              <td>${badgeFor(cp.status, cp.due)}</td>
              <td><input type="date" data-custom-pay-date="${idx}" value="${esc(cp.paidDate)}" style="width:150px;"></td>
              <td class="no-print"><button class="attach-remove" data-custom-remove="${idx}" title="Remove payment">×</button></td>
            </tr>`;
            }
          }).join('')}
        </tbody>
      </table>
      <div class="no-print" style="padding:14px 20px;border-top:1px solid var(--line);">
        <button class="btn btn-ghost btn-sm" data-custom-add>+ Add extra payment</button>
        ${hiddenPresets.length ? `
        <div style="margin-top:12px;font-size:11.5px;color:var(--ink-soft);">
          Removed from this file: ${hiddenPresets.map(h=>`<button class="btn btn-ghost btn-sm" data-restore-payment="${h.key}" style="margin:3px 6px 0 0;">↺ ${esc(h.label)}</button>`).join('')}
        </div>` : ''}
      </div>
    </div>
  </div>

  <div class="row c2">
    <div class="card">
      <div class="card-head"><h2><span class="eyebrow">Checklist</span>&nbsp; Attachments</h2></div>
      <div class="card-body">
        ${renderAttachmentRow(c,'contract','Contract')}
        ${renderAttachmentRow(c,'passport','Client Passport')}
        ${renderAttachmentRow(c,'ourInvoice','Our Invoice')}
        ${renderAttachmentRow(c,'otherBrokerInvoice', c.role==='retail' ? 'Central Agent Invoice' : 'Retail Broker Invoice')}
        ${c.type!=='sale' && c.role==='retail' ? `<div class="checklist-item">
          <input type="checkbox" data-att="prefListSent" ${c.attachments.prefListSent?'checked':''} id="pref1">
          <label for="pref1">Preference list sent to client</label>
        </div>` : ''}
        ${c.type!=='sale' && c.role==='retail' ? `<div class="checklist-item">
          <input type="checkbox" data-att="prefListSentToCrew" ${c.attachments.prefListSentToCrew?'checked':''} id="pref3">
          <label for="pref3">Preference list sent to crew</label>
        </div>` : ''}
        ${c.type!=='sale' ? `<div class="checklist-item">
          <input type="checkbox" data-att="prefListReceived" ${c.attachments.prefListReceived?'checked':''} id="pref2">
          <label for="pref2">Preference list received</label>
        </div>` : ''}
        ${renderFeedbackChecklistRow(c)}
        <div class="divider-label">Addendums</div>
        ${c.attachments.addendums.map((a,i)=>`
          <div class="checklist-item">
            <input type="checkbox" data-addendum-toggle="${i}" ${a.done?'checked':''}>
            <input type="text" data-addendum-name="${i}" value="${esc(a.name)}" placeholder="Addendum ${i+1} description">
            <button class="attach-remove" data-addendum-remove="${i}" title="Remove">×</button>
          </div>
        `).join('')}
        <button class="btn btn-ghost btn-sm no-print" style="margin-top:10px;" data-addendum-add>+ Add addendum</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2><span class="eyebrow">Free text</span>&nbsp; Notes</h2></div>
      <div class="card-body">
        <textarea data-f="notes" rows="12" placeholder="Internal notes about this charter file…">${esc(c.notes)}</textarea>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2><span class="eyebrow">Reconciliation</span>&nbsp; Incoming vs Outgoing</h2></div>
    <div class="card-body" style="padding:0;">
      <table>
        <thead><tr><th>Description</th><th>Reason / Notes</th><th>Due</th><th style="text-align:right;">Incoming (€)</th><th style="text-align:right;">Outgoing (€)</th></tr></thead>
        <tbody>
          ${ledger.rows.length ? ledger.rows.map(r=>`
            <tr>
              <td>${esc(r.description)}${r.isRecon?' <span class="override-flag">· manual</span>':''}</td>
              <td class="muted">${esc(r.reason)||'—'}</td>
              <td class="mono">${r.due?fmtDate(r.due):'—'}</td>
              <td style="text-align:right;" class="amount">${r.direction==='in' ? (r.amount===null||r.amount===undefined?'<span class="muted">not entered</span>':fmtMoney(r.amount)) : '—'}</td>
              <td style="text-align:right;" class="amount">${r.direction==='out' ? (r.amount===null||r.amount===undefined?'<span class="muted">not entered</span>':fmtMoney(r.amount)) : '—'}</td>
            </tr>`).join('') : `<tr><td colspan="5">${emptyState('Nothing to reconcile yet','Amounts will appear here once the charter rate and payment schedule are filled in.')}</td></tr>`}
        </tbody>
        ${ledger.rows.length ? `<tfoot>
          <tr>
            <td colspan="3" style="text-align:right;font-weight:700;">Total</td>
            <td style="text-align:right;font-weight:700;" class="amount">${fmtMoney(ledger.totalIn)}</td>
            <td style="text-align:right;font-weight:700;" class="amount">${fmtMoney(ledger.totalOut)}</td>
          </tr>
          <tr>
            <td colspan="3" style="text-align:right;font-weight:700;">Balance (In − Out)</td>
            <td colspan="2" style="text-align:right;font-weight:700;" class="amount">
              ${Math.abs(ledger.diff)<0.005
                ? '<span class="badge badge-ok">Matches</span>'
                : `<span class="badge badge-danger">${fmtMoney(ledger.diff)}</span>`}
            </td>
          </tr>
        </tfoot>` : ''}
      </table>
      ${ledger.rows.length && Math.abs(ledger.diff)>=0.005 ? `
      <div class="no-print" style="padding:16px 20px;border-top:1px solid var(--line);background:var(--danger-bg);">
        <div style="font-size:12.5px;color:var(--danger);font-weight:700;margin-bottom:8px;">
          Incoming and outgoing totals don't match (difference: ${fmtMoney(ledger.diff)}). If this is a known leftover amount, record it below:
        </div>
        <div class="row c3">
          <div class="field" style="margin-bottom:0;"><label class="field-label">Adjustment amount (€)</label><input type="text" inputmode="decimal" data-recon="amount" data-money value="${esc(c.reconciliation.amount)}" placeholder="0.00"></div>
          <div class="field" style="margin-bottom:0;"><label class="field-label">Add to</label>
            <select data-recon="direction">
              <option value="in" ${c.reconciliation.direction==='in'?'selected':''}>Incoming</option>
              <option value="out" ${c.reconciliation.direction==='out'?'selected':''}>Outgoing</option>
            </select>
          </div>
          <div class="field" style="margin-bottom:0;"><label class="field-label">Note</label><input type="text" data-recon="note" value="${esc(c.reconciliation.note)}" placeholder="e.g. bank fee, rounding, refuso"></div>
        </div>
      </div>` : ''}
    </div>
  </div>
  </div>

  ${renderCasePrintSheet(c, {rate,vatAmt,apaAmt,retailComm,caComm}, unifiedRows, ledger)}
  `;
}

function renderCasePrintSheet(c, money, unifiedRows, ledger){
  const phase = getEffectivePhase(c);
  const statusLabel = (STATUS_META[phase] || STATUS_META.negotiation).label;
  const {rate,vatAmt,apaAmt,retailComm,caComm} = money;
  const linkedFeedback = STATE.feedback.find(f=>f.linkedCaseId===c.id);

  const scheduleRows = unifiedRows.map(row=>{
    if(row.type==='fixed'){
      const p = row.data, st = paymentStatus(c,p.key);
      const amount = p.manualAmount ? c[p.manualField]
        : (p.amountOverridden ? c.paymentOverrides[p.key].amount : p.expectedAmount);
      return {label:p.label, due:p.due, amount, paid:st.status==='paid', paidDate:st.paidDate};
    }
    const cp = row.data;
    return {label:cp.description||'Extra payment', due:cp.due, amount:cp.amount, paid:cp.status==='paid', paidDate:cp.paidDate};
  });

  const checklistFlags = [
    ['Contract', !!c.attachments.contract],
    ['Client Passport', !!c.attachments.passport],
    ['Our Invoice', !!c.attachments.ourInvoice],
    [c.role==='retail'?'Central Agent Invoice':'Retail Broker Invoice', !!c.attachments.otherBrokerInvoice],
    ['Feedback', !!linkedFeedback],
  ];
  if(c.type!=='sale'){
    if(c.role==='retail') checklistFlags.push(['Pref. list sent (client)', !!c.attachments.prefListSent], ['Pref. list sent (crew)', !!c.attachments.prefListSentToCrew]);
    checklistFlags.push(['Pref. list received', !!c.attachments.prefListReceived]);
  }

  return `
  <div class="print-only-case">
    <div class="ps-header">
      <div class="ps-brand">West Coast International</div>
      <div class="ps-title">${c.type==='sale'?'Sale File':'Charter File'} ${esc(c.caseNumber||'')} <span class="ps-status">${esc(statusLabel)}</span></div>
    </div>

    <table class="ps-kv">
      <tr><th>Client</th><td>${esc(c.clientName)||'—'}</td><th>Yacht</th><td>${esc(c.yachtName)||'—'}</td></tr>
      <tr><th>Role</th><td>${c.role==='retail'?'Retail Broker':'Central Agent'}</td><th>Person in Charge</th><td>${esc(c.personInCharge)||'—'}</td></tr>
      ${c.type==='sale' ? `
      <tr><th>Contract Sign Date</th><td colspan="3">${c.contractSignDate?fmtDate(c.contractSignDate):'—'}</td></tr>
      ` : `
      <tr><th>Charter Dates</th><td colspan="3">${c.charterStartDate?fmtDate(c.charterStartDate):'—'} ${esc(c.charterStartTime)} &nbsp;→&nbsp; ${c.charterEndDate?fmtDate(c.charterEndDate):'—'} ${esc(c.charterEndTime)}</td></tr>
      <tr><th>Route</th><td>${esc(c.departureLocation)||'—'} → ${esc(c.arrivalLocation)||'—'}</td><th>Contract Sign</th><td>${c.contractSignDate?fmtDate(c.contractSignDate):'—'}</td></tr>
      `}
    </table>

    <table class="ps-kv">
      ${c.type==='sale' ? `
      <tr><th>Sale Price</th><td>${fmtMoney(rate)}</td><th>VAT</th><td>${c.saleVatPaid==='paid'?'Paid':c.saleVatPaid==='unpaid'?'Not paid':'—'}</td></tr>
      <tr><th>Deposit / Earnest</th><td colspan="3">${esc(c.saleDepositPct)||'—'}%</td></tr>
      ` : `
      <tr><th>Charter Rate</th><td>${fmtMoney(rate)}</td><th>VAT (${esc(c.vatPct)||0}%)</th><td>${fmtMoney(vatAmt)}</td></tr>
      <tr><th>APA (${esc(c.apaPct)||0}%)</th><td>${fmtMoney(apaAmt)}</td><th>Delivery Fee</th><td>${fmtMoney(c.deliveryFee)}</td></tr>
      `}
      <tr><th>Retail Comm.</th><td>${fmtMoney(retailComm)}${c.retailBrokerName?' — '+esc(c.retailBrokerName):''}</td><th>Central Comm.</th><td>${fmtMoney(caComm)}${c.caBrokerName?' — '+esc(c.caBrokerName):''}</td></tr>
    </table>

    <div class="ps-section-title">Payment Schedule</div>
    <table class="ps-schedule">
      <thead><tr><th>Payment</th><th>Due</th><th style="text-align:right;">Amount</th><th>Status</th><th>Paid on</th></tr></thead>
      <tbody>
        ${scheduleRows.length ? scheduleRows.map(r=>`
        <tr>
          <td>${esc(r.label)}</td>
          <td>${r.due?fmtDate(r.due):'—'}</td>
          <td style="text-align:right;">${r.amount!==null && r.amount!==undefined && r.amount!=='' ? fmtMoney(r.amount) : '—'}</td>
          <td>${r.paid?'Paid':'Pending'}</td>
          <td>${r.paidDate?fmtDate(r.paidDate):'—'}</td>
        </tr>`).join('') : `<tr><td colspan="5">—</td></tr>`}
      </tbody>
    </table>

    <div class="ps-recon">
      <strong>Reconciliation:</strong> Incoming ${fmtMoney(ledger.totalIn)} &nbsp;·&nbsp; Outgoing ${fmtMoney(ledger.totalOut)} &nbsp;·&nbsp; Balance ${Math.abs(ledger.diff)<0.005 ? 'Matches' : fmtMoney(ledger.diff)}
    </div>

    <div class="ps-section-title">Checklist</div>
    <div class="ps-checklist">
      ${checklistFlags.map(([label,done])=>`<span class="ps-check ${done?'done':''}">${done?'✓':'○'} ${esc(label)}</span>`).join('')}
    </div>

    ${c.notes ? `<div class="ps-section-title">Notes</div><div class="ps-notes">${esc(c.notes)}</div>` : ''}
  </div>`;
}

function renderFeedbackChecklistRow(c){
  const linked = STATE.feedback.find(f=>f.linkedCaseId===c.id);
  return `<div class="checklist-item">
    <input type="checkbox" disabled ${linked?'checked':''} id="att-feedback">
    <label for="att-feedback">Feedback received${linked?'':' (flags automatically once linked)'}</label>
    ${linked ? `<button class="btn btn-ghost btn-sm no-print" data-open-feedback="${linked.id}">Open →</button>` : ''}
  </div>`;
}

function renderAttachmentRow(c, key, label){
  return `<div class="checklist-item">
    <input type="checkbox" data-att="${key}" ${c.attachments[key]?'checked':''} id="att-${key}">
    <label for="att-${key}">${esc(label)}</label>
  </div>`;
}

function renderStatusChip(c, withLabel){
  const phase = getEffectivePhase(c);
  const meta = STATUS_META[phase] || STATUS_META.negotiation;
  if(withLabel===false){
    return `<span class="status-dot" style="background:${meta.dot};" title="${esc(meta.label)}"></span>`;
  }
  return `<span class="status-chip" title="${esc(meta.label)}"><span class="status-dot" style="background:${meta.dot};"></span>${esc(meta.label)}</span>`;
}

function renderStatusControl(c){
  const phase = getEffectivePhase(c);
  const auto = (phase==='in_progress' || phase==='completed');
  const readyToClose = phase==='completed' && isReadyToClose(c) && c.status!=='closed';
  const selectableOptions = [
    ['negotiation','In Negotiation'],
    ['option','Option'],
    ['contract','Under Contract'],
    ['confirmed','Confirmed'],
    ['closed','Closed']
  ];
  let html = `<span style="display:inline-flex;align-items:center;gap:8px;">${renderStatusChip(c, false)}<select class="no-print" data-status-select style="font-size:12.5px;font-weight:600;padding:7px 10px;">
    ${selectableOptions.map(([v,l])=>`<option value="${v}" ${c.status===v?'selected':''}>${l}</option>`).join('')}
  </select></span>`;
  if(auto){
    html += ` <span class="badge ${STATUS_META[phase].cls}">${STATUS_META[phase].label}</span>`;
  }
  if(readyToClose){
    html += ` <span class="badge badge-ok" title="Charter completed, every payment marked paid, and the ledger balances">Ready to close</span>`;
  }
  return html;
}

function emptyState(title, sub){
  return `<div class="empty-state"><div class="mark-big">W</div><div style="font-family:'Arial','Poppins',sans-serif;font-size:16px;color:var(--ink);font-weight:700;">${esc(title)}</div><div style="margin-top:4px;">${esc(sub)}</div></div>`;
}

    if(statusSelect) statusSelect.addEventListener('change', ()=>{

      const key = el.dataset.payToggle;

        /* if the amount was never edited, "lock in" the calculated figure into
           the field itself (instead of leaving it as a greyed-out placeholder)

        if(item && !item.manualAmount && item.expectedAmount!==null && item.expectedAmount!==undefined){
