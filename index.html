        <thead><tr><th>Description</th><th>Reason / Notes</th><th>Paid</th><th style="text-align:right;">Incoming (€)</th><th style="text-align:right;">Outgoing (€)</th></tr></thead>
        <tbody>
          ${ledger.rows.length ? ledger.rows.map(r=>`
            <tr>
              <td>${esc(r.description)}${r.isRecon?' <span class="override-flag">· manual</span>':''}</td>
              <td class="muted">${esc(r.reason)||'—'}</td>
              <td class="mono">${r.paidDate?fmtDate(r.paidDate):'—'}</td>
              <td style="text-align:right;" class="amount">${r.direction==='in' ? (r.amount===null||r.amount===undefined?'<span class="muted">not entered</span>':fmtMoney(r.amount)) : '—'}</td>

        ${ledger.rows.length ? `<tfoot>
          <tr>
            <td colspan="3" style="text-align:right;font-weight:700;">Total</td>
            <td style="text-align:right;font-weight:700;" class="amount">${fmtMoney(ledger.totalIn)}</td>
            <td style="text-align:right;font-weight:700;" class="amount">${fmtMoney(ledger.totalOut)}</td>

            <td colspan="3" style="text-align:right;font-weight:700;">Balance (In − Out)</td>

                ? '<span class="badge badge-ok">Matches</span>'

          <span>${Math.abs(ledger.diff)>=0.005 ? `Incoming and outgoing totals don't match (difference: ${fmtMoney(ledger.diff)}). If this is a known leftover amount, record it below:` : 'Review or change the manual adjustment below:'}</span>

        <div class="row c3">
          <div class="field" style="margin-bottom:0;"><label class="field-label">Adjustment amount (€)</label><input type="text" inputmode="decimal" data-recon="amount" data-money value="${esc(c.reconciliation.amount)}" placeholder="0.00"></div>
          <div class="field" style="margin-bottom:0;"><label class="field-label">Add to</label>
            <select data-recon="direction">
              <option value="in" ${c.reconciliation.direction==='in'?'selected':''}>Incoming</option>
              <option value="out" ${c.reconciliation.direction==='out'?'selected':''}>Outgoing</option>

          Manual adjustment: ${fmtMoney(num(c.reconciliation.amount))} added to ${c.reconciliation.direction==='in'?'Incoming':'Outgoing'}${c.reconciliation.note?' — '+esc(c.reconciliation.note):''}

        <button class="btn btn-ghost btn-sm" data-recon-edit>Edit</button>
      </div>` : '')}
    </div>
  </div>

  ${renderCasePrintSheet(c, {rate,vatAmt,apaAmt,retailComm,caComm}, unifiedRows, ledger)}

}

function renderCasePrintSheet(c, money, unifiedRows, ledger){
  const phase = getEffectivePhase(c);
  const statusLabel = (STATUS_META[phase] || STATUS_META.negotiation).label;
  const {rate,vatAmt,apaAmt,retailComm,caComm} = money;
  const linkedFeedback = STATE.feedback.find(f=>f.linkedCaseId===c.id);

  const scheduleRows = unifiedRows.map(row=>{
    if(row.type==='fixed'){
      const p = row.data, st = paymentStatus(c,p.key);
      const amount = p.manualAmount ? c[p.manualField]
        : (p.amountOverridden ? c.paymentOverrides[p.key].amount : p.expectedAmount);
      return {label:p.label, due:p.due, amount, paid:st.status==='paid', paidDate:st.paidDate};
    }
    const cp = row.data;
    return {label:cp.description||'Extra payment', due:cp.due, amount:cp.amount, paid:cp.status==='paid', paidDate:cp.paidDate};
  });

  const checklistFlags = [
    ['Contract', !!c.attachments.contract],
    ['Client Passport', !!c.attachments.passport],
    ['Know Your Client', !!c.attachments.kyc],
    ['Our Invoice', !!c.attachments.ourInvoice],
  ];
  if(c.role==='central') checklistFlags.push(['Retail Broker Invoice', !!c.attachments.otherBrokerInvoice]);
  checklistFlags.push(["Owner's Invoice to Client", !!c.attachments.ownerInvoiceToClient], ['Feedback', !!linkedFeedback]);
  if(c.type!=='sale'){
    if(c.role==='central'){
      checklistFlags.push(['Pref. list sent (client)', !!c.attachments.prefListSent], ['Pref. list received', !!c.attachments.prefListReceived], ['Pref. list sent (crew)', !!c.attachments.prefListSentToCrew]);
    }else{
      checklistFlags.push(['Pref. list sent (client)', !!c.attachments.prefListSent], ['Pref. list sent (crew)', !!c.attachments.prefListSentToCrew], ['Pref. list received', !!c.attachments.prefListReceived]);
    }
  }

  return `
  <div class="print-only-case">
    <div class="ps-header">
      <div class="ps-brand">West Coast International</div>
      <div class="ps-title">${c.type==='sale'?'Sale File':'Charter File'} ${esc(c.caseNumber||'')} <span class="ps-status">${esc(statusLabel)}</span></div>
    </div>

    <table class="ps-kv">
      <tr><th>Client</th><td>${esc(c.clientName)||'—'}</td><th>Yacht</th><td>${esc(c.yachtName)||'—'}</td></tr>
      <tr><th>Role</th><td>${c.role==='retail'?'Retail Broker':'Central Agent'}</td><th>Person in Charge</th><td>${esc(c.personInCharge)||'—'}</td></tr>
      ${c.type==='sale' ? `
      <tr><th>Contract Sign Date</th><td colspan="3">${c.contractSignDate?fmtDate(c.contractSignDate):'—'}</td></tr>
      ` : `
      <tr><th>Charter Dates</th><td colspan="3">${c.charterStartDate?fmtDate(c.charterStartDate):'—'} ${esc(c.charterStartTime)} &nbsp;→&nbsp; ${c.charterEndDate?fmtDate(c.charterEndDate):'—'} ${esc(c.charterEndTime)}</td></tr>
      <tr><th>Route</th><td>${esc(c.departureLocation)||'—'} → ${esc(c.arrivalLocation)||'—'}</td><th>Contract Sign</th><td>${c.contractSignDate?fmtDate(c.contractSignDate):'—'}</td></tr>
      `}
    </table>

    <table class="ps-kv">
      ${c.type==='sale' ? `
      <tr><th>Sale Price</th><td>${fmtMoney(rate)}</td><th>VAT</th><td>${c.saleVatPaid==='paid'?'Paid':c.saleVatPaid==='unpaid'?'Not paid':'—'}</td></tr>
      <tr><th>Deposit / Earnest</th><td colspan="3">${esc(c.saleDepositPct)||'—'}%</td></tr>
      ` : `
      <tr><th>Charter Rate</th><td>${fmtMoney(rate)}</td><th>VAT (${esc(c.vatPct)||0}%)</th><td>${fmtMoney(vatAmt)}</td></tr>
      <tr><th>APA (${esc(c.apaPct)||0}%)</th><td>${fmtMoney(apaAmt)}</td><th>Delivery Fee</th><td>${fmtMoney(c.deliveryFee)}</td></tr>
      `}
      <tr><th>Retail Comm.</th><td>${fmtMoney(retailComm)}${c.retailBrokerName?' — '+esc(c.retailBrokerName):''}</td><th>Central Comm.</th><td>${fmtMoney(caComm)}${c.caBrokerName?' — '+esc(c.caBrokerName):''}</td></tr>
    </table>

    <div class="ps-section-title">Payment Schedule</div>
    <table class="ps-schedule">
      <thead><tr><th>Payment</th><th>Due</th><th style="text-align:right;">Amount</th><th>Status</th><th>Paid on</th></tr></thead>
      <tbody>
        ${scheduleRows.length ? scheduleRows.map(r=>`
        <tr>
          <td>${esc(r.label)}</td>
          <td>${r.due?fmtDate(r.due):'—'}</td>
          <td style="text-align:right;">${r.amount!==null && r.amount!==undefined && r.amount!=='' ? fmtMoney(r.amount) : '—'}</td>
          <td>${r.paid?'Paid':'Pending'}</td>
          <td>${r.paidDate?fmtDate(r.paidDate):'—'}</td>
        </tr>`).join('') : `<tr><td colspan="5">—</td></tr>`}
      </tbody>
    </table>

    <div class="ps-recon">
      <strong>Reconciliation:</strong> Incoming ${fmtMoney(ledger.totalIn)} &nbsp;·&nbsp; Outgoing ${fmtMoney(ledger.totalOut)} &nbsp;·&nbsp; Balance ${Math.abs(ledger.diff)<0.005 ? 'Matches' : fmtMoney(ledger.diff)}
    </div>

    <div class="ps-section-title">Checklist</div>
    <div class="ps-checklist">
      ${checklistFlags.map(([label,done])=>`<span class="ps-check ${done?'done':''}">${done?'✓':'○'} ${esc(label)}</span>`).join('')}
    </div>

    ${c.notes ? `<div class="ps-section-title">Notes</div><div class="ps-notes">${esc(c.notes)}</div>` : ''}
  </div>`;
}

function renderFeedbackChecklistRow(c){
  const linked = STATE.feedback.find(f=>f.linkedCaseId===c.id);
  return `<div class="checklist-item">
    <input type="checkbox" disabled ${linked?'checked':''} id="att-feedback">
    <label for="att-feedback">Feedback received${linked?'':' (flags automatically once linked)'}</label>
    ${linked ? `<button class="btn btn-ghost btn-sm no-print" data-open-feedback="${linked.id}">Open →</button>` : ''}
  </div>`;
}

function buildPreferenceListUrl(c, wci){
  const base = (STATE.preferenceListSync.baseUrl || '').trim();
  if(!base) return '';
  const params = new URLSearchParams();
  if(wci) params.set('wci','1');
  if(c.clientName) params.set('client', c.clientName);
  if(c.yachtName) params.set('yacht', c.yachtName);
  if(c.charterStartDate) params.set('start', c.charterStartDate);
  if(c.charterEndDate) params.set('end', c.charterEndDate);
  const qs = params.toString();
  if(!qs) return base;
  return base + (base.includes('?') ? '&' : '?') + qs;
}
function renderPreferenceListSection(c){
  const baseUrl = STATE.preferenceListSync.baseUrl || '';
  const open = !!(STATE.view.openSections && STATE.view.openSections.prefListSettings);
  const received = STATE.preferenceLists.find(p=>p.linkedCaseId===c.id);
  return `
    <div class="card no-print">
      <div class="card-head" data-toggle-section="prefListSettings" style="cursor:pointer;">
        <h2><span class="eyebrow">Send</span>&nbsp; Preference List <span class="muted" style="font-weight:400;">${open?'▾':'▸'}</span></h2>
      </div>
      <div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-brass btn-sm" id="btn-copy-preflist-wci" ${!baseUrl?'disabled':''}>Copy link (West Coast)</button>
        <button class="btn btn-ghost btn-sm" id="btn-copy-preflist-plain" ${!baseUrl?'disabled':''}>Copy link (no branding)</button>
      </div>
      ${open || !baseUrl ? `
      <div class="card-body" style="border-top:1px solid var(--line);">
        <div class="field"><label class="field-label">Preference List form URL (set once — shared by everyone)</label><input type="text" id="preflist-base-url" value="${esc(baseUrl)}" placeholder="https://preference-list-form.vercel.app/preference-list.html"></div>
        <div class="field-hint">Client name, yacht and charter dates from this file are added to the link automatically.</div>
      </div>` : ''}
      ${received ? `
      <div class="card-body" style="border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
        <div style="font-size:12.5px;color:var(--ink-soft);">✓ Preference list received${received.receivedAt?' on '+fmtDate(received.receivedAt.slice(0,10)):''}</div>
        <button class="btn btn-ghost btn-sm" data-open-preflist="${received.id}">Open / print / send to captain →</button>
      </div>` : ''}
    </div>
  `;
}

/* Suggestions for Agency Name / embarkation-disembarkation / cruising area
   grow on their own — every value ever entered on any charter file becomes
   a future suggestion, no separate list to maintain. Native <datalist>
   still lets the person type any new value freely. */
function renderSharedDatalists(){
  const uniqueSorted = arr => Array.from(new Set(arr.filter(Boolean))).sort((a,b)=>a.localeCompare(b));
  const agencyNames = uniqueSorted(STATE.cases.flatMap(c=>[c.retailAgencyName, c.caAgencyName]));
  const locations = uniqueSorted(STATE.cases.flatMap(c=>[c.departureLocation, c.arrivalLocation]));
  const cruisingAreas = uniqueSorted(STATE.cases.map(c=>c.cruisingArea));
  return `
    <datalist id="dl-agency-names">${agencyNames.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
    <datalist id="dl-locations">${locations.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
    <datalist id="dl-cruising-areas">${cruisingAreas.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
  `;
}

function renderAttachmentRow(c, key, label){
  return `<div class="checklist-item">
    <input type="checkbox" data-att="${key}" ${c.attachments[key]?'checked':''} id="att-${key}">
    <label for="att-${key}">${esc(label)}</label>
  </div>`;
}

function hasLedgerMismatch(c){
  try{ return Math.abs(buildLedger(c).diff) >= 0.005; }
  catch(e){ return false; }
}
function renderStatusChip(c, withLabel){
  const phase = getEffectivePhase(c);
  const meta = STATUS_META[phase] || STATUS_META.negotiation;
  const mismatchDot = hasLedgerMismatch(c)
    ? `<span class="status-dot" style="background:var(--danger);" title="Incoming and outgoing totals don't match"></span>`
    : '';
  if(withLabel===false){
    return `<span style="display:inline-flex;align-items:center;gap:5px;"><span class="status-dot" style="background:${meta.dot};" title="${esc(meta.label)}"></span>${mismatchDot}</span>`;
  }
  return `<span class="status-chip" title="${esc(meta.label)}"><span class="status-dot" style="background:${meta.dot};"></span>${esc(meta.label)}${mismatchDot}</span>`;
}

function renderStatusControl(c){
  const phase = getEffectivePhase(c);
  const auto = (phase==='in_progress' || phase==='completed');
  const readyToClose = phase==='completed' && isReadyToClose(c) && c.status!=='closed';
  const selectableOptions = [
    ['negotiation','In Negotiation'],
    ['option','Option'],
    ['contract','Under Contract'],
    ['confirmed','Confirmed'],
    ['closed','Closed']
  ];
  let html = `<span style="display:inline-flex;align-items:center;gap:8px;">${renderStatusChip(c, false)}<select class="no-print" data-status-select style="font-size:12.5px;font-weight:600;padding:7px 10px;">
    ${selectableOptions.map(([v,l])=>`<option value="${v}" ${c.status===v?'selected':''}>${l}</option>`).join('')}
  </select></span>`;
  if(auto){
    html += ` <span class="badge ${STATUS_META[phase].cls}">${STATUS_META[phase].label}</span>`;
  }
  if(readyToClose){
    html += ` <span class="badge badge-ok" title="Charter completed, every payment marked paid, and the ledger balances">Ready to close</span>`;
  }
  return html;
}

function emptyState(title, sub){
  return `<div class="empty-state"><div class="mark-big">W</div><div style="font-family:'Arial','Poppins',sans-serif;font-size:16px;color:var(--ink);font-weight:700;">${esc(title)}</div><div style="margin-top:4px;">${esc(sub)}</div></div>`;
}

/* ---------------- events ---------------- */
function wireGlobalEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click', ()=>{
    STATE.view = {tab:el.dataset.tab, caseId:null};
    render();
  }));

  const newFileBtn = document.getElementById('btn-new-file');
  if(newFileBtn) newFileBtn.addEventListener('click', ()=>{
    const c = newCase('charter');
    STATE.cases.push(c);
    STATE.view = {tab:'case', caseId:c.id};
    persistAndRender();
  });
  const signOutBtn = document.getElementById('btn-sign-out');
  if(signOutBtn) signOutBtn.addEventListener('click', signOut);

  const newFeedbackBtn = document.getElementById('btn-new-feedback');
  if(newFeedbackBtn) newFeedbackBtn.addEventListener('click', ()=>{
    const f = newFeedback();
    STATE.feedback.push(f);
    STATE.view = {tab:'feedback', feedbackId:f.id};
    persistAndRender();
  });
  const toggleFeedbackSettingsBtn = document.getElementById('btn-toggle-feedback-settings');
  if(toggleFeedbackSettingsBtn) toggleFeedbackSettingsBtn.addEventListener('click', ()=>{
    feedbackSettingsOpen = !feedbackSettingsOpen;
    render();
  });
  const copyLinkBtn = document.getElementById('btn-copy-form-link');
  if(copyLinkBtn) copyLinkBtn.addEventListener('click', ()=>copyToClipboard(STATE.feedbackSync.formLink || JOTFORM_URL));
  const importCsvBtn = document.getElementById('btn-import-csv');
  const fileInputCsv = document.getElementById('file-import-csv');
  if(importCsvBtn) importCsvBtn.addEventListener('click', ()=>fileInputCsv.click());
  if(fileInputCsv) fileInputCsv.addEventListener('change', handleImportCsv);
  const syncBtn = document.getElementById('btn-sync-feedback');
  if(syncBtn) syncBtn.addEventListener('click', syncFeedbackFromServer);
  const syncPrefListsBtn = document.getElementById('btn-sync-preflists');
  if(syncPrefListsBtn) syncPrefListsBtn.addEventListener('click', syncPreferenceListsFromServer);
  app.querySelectorAll('[data-open-preflist]').forEach(el=>el.addEventListener('click', ()=>{
    STATE.view = {tab:'preferences', prefListId:el.dataset.openPreflist};
    render();
  }));
  app.querySelectorAll('[data-back-to-preflists]').forEach(el=>el.addEventListener('click', ()=>{
    STATE.view = {tab:'preferences', prefListId:null};
    render();
  }));
  const prefListSearchQ = document.getElementById('preflist-search-q');

      if(!c.saleDueDates) c.saleDueDates = {};
      c.saleDueDates[el.dataset.saleDue] = el.value;
      persistAndRender();
    }));
    /* Manual-drag reordering using Pointer Events with pointer capture.
       Pointer capture keeps every subsequent move/up event routed to the
       handle that started the drag even if the cursor slips outside the row
       or near the edge of a small preview panel — a plain mousemove/mouseup
       pair (or the native HTML5 drag API) loses the gesture in exactly that
       situation, which is what was breaking it. A small auto-scroll near the
       top/bottom edge makes long tables reachable too.
       Preset and extra payments share one ordered list (see
       getUnifiedScheduleRows) so either can be dragged anywhere among the
       other, not just reordered within its own group. */
    function startRowDrag(handle, srcRow, srcId, e, findRow, applyReorder){
      if(e.button!==undefined && e.button!==0) return;
      e.preventDefault();
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
      srcRow.classList.add('dragging-row');
      let overRow = null;
      let overPosition = null; // 'before' | 'after'
      let scrollTimer = null;
      function clearIndicator(){
        if(overRow) overRow.classList.remove('drag-insert-before','drag-insert-after');
      }
      function autoScroll(clientY){
        clearInterval(scrollTimer);
        const edge = 70;
        if(clientY < edge) scrollTimer = setInterval(()=>window.scrollBy(0,-18), 16);
        else if(clientY > window.innerHeight - edge) scrollTimer = setInterval(()=>window.scrollBy(0,18), 16);
      }
      function onMove(ev){
        autoScroll(ev.clientY);
        const row = findRow(ev.clientX, ev.clientY);
        if(row && row!==srcRow){
          const rect = row.getBoundingClientRect();
          const before = (ev.clientY - rect.top) < rect.height/2;
          if(row!==overRow) clearIndicator();
          row.classList.remove('drag-insert-before','drag-insert-after');
          row.classList.add(before ? 'drag-insert-before' : 'drag-insert-after');
          overRow = row;
          overPosition = before ? 'before' : 'after';
        }else{
          clearIndicator();
          overRow = null;
          overPosition = null;
        }
      }
      function onUp(ev){
        clearInterval(scrollTimer);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        try{ handle.releasePointerCapture(ev.pointerId); }catch(err){}
        srcRow.classList.remove('dragging-row');
        clearIndicator();
        if(overRow) applyReorder(srcId, overRow, overPosition);
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    }
    function reorderUnified(srcId, targetId, position){
      if(!targetId || targetId===srcId) return;
      const order = getUnifiedScheduleRows(c).map(r=>r.id);
      const from = order.indexOf(srcId);
      if(from===-1) return;
      order.splice(from,1);
      let to = order.indexOf(targetId);
      if(to===-1) return;
      if(position==='after') to += 1;
      order.splice(to,0,srcId);
      c.paymentOrder = order;
      persistAndRender();
    }
    app.querySelectorAll('[data-drag-id]').forEach(handle=>{
      handle.addEventListener('pointerdown', (e)=>{
        const srcRow = handle.closest('tr');
        if(!srcRow) return;
        startRowDrag(handle, srcRow, handle.dataset.dragId, e,
          (x,y)=>{ const el=document.elementFromPoint(x,y); return el ? el.closest('tr[data-row-id]') : null; },
          (srcId, targetRow, position)=> reorderUnified(srcId, targetRow.dataset.rowId, position));
      });
    });
    /* Simple, always-reliable fallback next to the drag handle: plain click
       buttons that swap the row with its neighbour. */
    app.querySelectorAll('[data-move-id]').forEach(el=>el.addEventListener('click', ()=>{
      const id = el.dataset.moveId;
      const dir = el.dataset.moveDir;
      const order = getUnifiedScheduleRows(c).map(r=>r.id);
      const idx = order.indexOf(id);
      const swapWith = dir==='up' ? idx-1 : idx+1;
      if(idx<0 || swapWith<0 || swapWith>=order.length) return;
      [order[idx], order[swapWith]] = [order[swapWith], order[idx]];
      c.paymentOrder = order;
      persistAndRender();
    }));
    app.querySelectorAll('[data-override]').forEach(el=>{
      el.addEventListener(liveEventFor(el), ()=>{
        if(!c.paymentOverrides) c.paymentOverrides = {};
        const key = el.dataset.overrideKey;
        const field = el.dataset.override; // 'amount' | 'note'
        if(!c.paymentOverrides[key]) c.paymentOverrides[key] = {amount:'', note:''};
        c.paymentOverrides[key][field] = el.value;
        persistOnly();
        softRerenderCase(el);
      });
    });
    /* format every money field to two decimals once the person leaves it —
       e.g. typing "40000" becomes "40000.00" on blur — so every amount in
       the file follows the same €1,000.00-style formatting */
    app.querySelectorAll('input[type="text"][data-money]').forEach(el=>{
      el.addEventListener('blur', ()=>{
        if(suppressMoneyBlur) return; // this blur was caused by our own re-render removing the element, not a real navigate-away
        if(el.value==='') return;
        const formatted = fmtMoneyPlain(num(el.value));
        el.value = formatted; // update what's on screen directly — no re-render needed for that part
        if(el.dataset.f){
          c[el.dataset.f] = formatted;
        }else if(el.dataset.override){
          if(!c.paymentOverrides) c.paymentOverrides = {};
          const k = el.dataset.overrideKey;
          if(!c.paymentOverrides[k]) c.paymentOverrides[k] = {amount:'', note:''};
          c.paymentOverrides[k][el.dataset.override] = formatted;
        }else if(el.dataset.custom){
          c.customPayments[+el.dataset.customIdx][el.dataset.custom] = formatted;
        }else if(el.dataset.recon){
          c.reconciliation[el.dataset.recon] = formatted;
        }
        /* Deliberately NOT re-rendering here. A blur can fire at almost any
           moment — mid-click into a different field, during a focus
           transition the browser hasn't finished settling yet — and every
           attempt to reconcile a render against "whatever has focus by the
           time it runs" turned out to be a race that occasionally rebuilt
           the DOM at exactly the wrong instant, silently eating keystrokes
           the person had already typed into the next field. Updating the
           input's own display value and the saved state (above) is enough:
           it's correct on screen right now, and anything elsewhere that
           depends on it (an "expected" placeholder, a cascade warning) will
           catch up the next time something else naturally triggers a
           render — which is always very soon. */
        persistOnly();
      });
    });
    app.querySelectorAll('[data-restore-payment]').forEach(el=>el.addEventListener('click', ()=>{
      if(c.hiddenPayments) delete c.hiddenPayments[el.dataset.restorePayment];
      persistAndRender();

    app.querySelectorAll('[data-att]').forEach(el=>el.addEventListener('change', ()=>{

    const vatAgencyToggle = app.querySelector('[data-vat-agency]');

    const copyPrefWciBtn = document.getElementById('btn-copy-preflist-wci');

    const picSelect = document.getElementById('person-in-charge-select');

    /* extra / custom payments */

    if(addPayBtn) addPayBtn.addEventListener('click', ()=>{
      c.customPayments.push({id: uid(), description:'', reason:'', direction:'out', amount:'', due:'', status:'pending', paidDate:''});
      persistAndRender();
    });
    app.querySelectorAll('[data-custom-remove]').forEach(el=>el.addEventListener('click', ()=>{
      c.customPayments.splice(+el.dataset.customRemove,1);
      persistAndRender();
    }));
    app.querySelectorAll('[data-custom]').forEach(el=>{
      el.addEventListener(liveEventFor(el), ()=>{
        const idx = +el.dataset.customIdx;
        const field = el.dataset.custom;
        c.customPayments[idx][field] = el.value;
        persistOnly();
        softRerenderCase(el);
      });
    });
    app.querySelectorAll('[data-custom-pay-toggle]').forEach(el=>el.addEventListener('change', ()=>{
      const idx = +el.dataset.customPayToggle;
      const cp = c.customPayments[idx];
      cp.status = el.checked ? 'paid' : 'pending';
      if(el.checked && !cp.paidDate) cp.paidDate = toISODate(new Date());
      persistAndRender();

    app.querySelectorAll('[data-custom-pay-date]').forEach(el=>el.addEventListener('change', ()=>{

    /* reconciliation adjustment */

function focusEl(id){
  const el = document.getElementById(id);
  if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; }
}

/* re-render just the case view without losing input focus for text typing in other fields
   — for simplicity & correctness with computed fields (commission/VAT/APA totals depending
   on rate), we re-render the whole case view but keep focus on the active element by id/name. */
let suppressMoneyBlur = false; // true only while softRerenderCase is tearing down & rebuilding the DOM
function softRerenderCase(activeEl){
  const active = document.activeElement;
  const f = active && active.dataset ? active.dataset.f : null;
  const fbField = active && active.dataset ? active.dataset.fb : null;
  const customField = active && active.dataset ? active.dataset.custom : null;
  const customIdx = active && active.dataset ? active.dataset.customIdx : null;
  const reconField = active && active.dataset ? active.dataset.recon : null;
  const overrideField = active && active.dataset ? active.dataset.override : null;
  const overrideKey = active && active.dataset ? active.dataset.overrideKey : null;
  const fbsyncField = active && active.dataset ? active.dataset.fbsync : null;
  const canSelect = supportsSelectionRange(active);
  const selStart = canSelect ? active.selectionStart : null;
  const selEnd = canSelect ? active.selectionEnd : null;
  /* Rebuilding the DOM below removes the currently-focused input, which makes
     the browser fire a genuine 'blur' event on it as a side effect — even
     though the person never actually left the field. The money-formatting
     blur handler would otherwise treat that as "done typing" and format the
     value after a single keystroke, which is exactly what was cutting typing
     off after one digit. Suppress it for just this synchronous re-render. */
  suppressMoneyBlur = true;
  render();
  suppressMoneyBlur = false;
  let again = null;
  if(f) again = document.querySelector(`[data-f="${f}"]`);
  else if(fbField) again = document.querySelector(`[data-fb="${fbField}"]`);
  else if(customField!=null && customIdx!=null) again = document.querySelector(`[data-custom="${customField}"][data-custom-idx="${customIdx}"]`);
  else if(reconField) again = document.querySelector(`[data-recon="${reconField}"]`);
  else if(overrideField && overrideKey) again = document.querySelector(`[data-override="${overrideField}"][data-override-key="${overrideKey}"]`);
  else if(fbsyncField) again = document.querySelector(`[data-fbsync="${fbsyncField}"]`);
  if(again){
    again.focus();
    if(canSelect && supportsSelectionRange(again)){
      try{ again.setSelectionRange(selStart, selEnd); }catch(e){}
    }else if(again.tagName==='INPUT' && again.type==='number'){
      /* number inputs don't support setSelectionRange; re-assigning the value
         after focus is what actually pushes the caret to the end in every
         browser, which is what stops digits from being prepended (reversed)
         on every keystroke. */
      const v = again.value;
      again.value = '';
      again.value = v;
    }
  }
}

function persistOnly(){ tryPersistLocal(); }
function persistAndRender(){ tryPersistLocal(); render(); }

/* ---------------- export / import ---------------- */
function exportData(){
  const blob = new Blob([JSON.stringify({cases:STATE.cases, nextCaseSeq, feedback:STATE.feedback, feedbackSync:STATE.feedbackSync, preferenceListSync:STATE.preferenceListSync, preferenceLists:STATE.preferenceLists, staffInitials:STATE.staffInitials}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'charter-files-' + toISODate(new Date()) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Data exported');
}
function handleImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(parsed && Array.isArray(parsed.cases)){
        STATE.cases = normalizeCases(parsed.cases);
        nextCaseSeq = parsed.nextCaseSeq || (STATE.cases.length+1);
        STATE.feedback = normalizeFeedbackList(parsed.feedback||[]);
        if(parsed.feedbackSync && typeof parsed.feedbackSync==='object'){
          STATE.feedbackSync = Object.assign({formLink:'', endpointUrl:'', secretKey:'', lastSyncedAt:''}, parsed.feedbackSync);
        }
        if(parsed.preferenceListSync && typeof parsed.preferenceListSync==='object'){
          STATE.preferenceListSync = Object.assign({baseUrl:'', lastSyncedAt:''}, parsed.preferenceListSync);
        }
        STATE.preferenceLists = normalizePreferenceLists(parsed.preferenceLists||[]);
        if(Array.isArray(parsed.staffInitials) && parsed.staffInitials.length) STATE.staffInitials = parsed.staffInitials;
        STATE.view = {tab:'cases', caseId:null};
        persistAndRender();
        showToast('Data imported successfully');
      }else{
        showToast('This file does not look like a valid export.', 'error');
      }
    }catch(err){
      showToast('Could not read this file: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ---------------- Jotform CSV import (client feedback) ----------------
   Jotform's CSV export uses the visible question text as column headers, so
   we match column names loosely against the question wording rather than an
   exact schema. Every field is a normal editable field afterwards, so a
   partial or slightly-off match is easy to fix by hand in the app. */
function parseCsv(text){
  // Handles quoted fields (with escaped "" and embedded commas/newlines).
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i], next = text[i+1];
    if(inQuotes){
      if(ch === '"' && next === '"'){ field += '"'; i++; }
      else if(ch === '"'){ inQuotes = false; }
      else field += ch;
    }else{
      if(ch === '"') inQuotes = true;
      else if(ch === ','){ row.push(field); field=''; }
      else if(ch === '\r'){ /* skip */ }
      else if(ch === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += ch;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length>1 || (r.length===1 && r[0]!==''));
}
function findColumn(headers, ...keywords){
  const lower = headers.map(h=>h.toLowerCase());
  for(const kw of keywords){
    const idx = lower.findIndex(h => h.includes(kw));
    if(idx>-1) return idx;
  }
  return -1;
}
function csvYesNo(v){
  const s = (v||'').trim().toLowerCase();
  if(s==='yes' || s==='y' || s==='true') return 'yes';
  if(s==='no' || s==='n' || s==='false') return 'no';
  return '';
}
function csvToDate(v){
  if(!v) return '';
  const s = v.trim();
  // Jotform date exports are commonly "MM-DD-YYYY", "DD-MM-YYYY" or "YYYY-MM-DD" depending on form locale.
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(m){
    // ambiguous MM-DD vs DD-MM — Jotform's default widget order is Month, Day, Year
    const mm = m[1].padStart(2,'0'), dd = m[2].padStart(2,'0');
    return `${m[3]}-${mm}-${dd}`;
  }
  return '';
}
/* ---------------- server sync (feedback-form.html + PHP backend) ---------------- */
async function syncFeedbackFromServer(){
  const s = STATE.feedbackSync;
  if(!s.endpointUrl){ showToast('Enter the Supabase project URL first.', 'error'); return; }
  if(!s.secretKey){ showToast('Enter the Supabase service_role key first.', 'error'); return; }
  const btn = document.getElementById('btn-sync-feedback');
  if(btn){ btn.disabled = true; btn.textContent = 'Syncing…'; }
  try{
    const base = s.endpointUrl.replace(/\/$/, '');
    const url = new URL(base + '/rest/v1/feedback');
    url.searchParams.set('select', '*');
    url.searchParams.set('order', 'received_at.asc');
    if(s.lastSyncedAt) url.searchParams.set('received_at', 'gt.' + s.lastSyncedAt);
    const res = await fetch(url.toString(), {
      headers: { 'apikey': s.secretKey, 'Authorization': 'Bearer ' + s.secretKey }
    });
    if(!res.ok) throw new Error('Supabase responded with ' + res.status);
    const list = await res.json();
    if(!Array.isArray(list)) throw new Error('Unexpected response format');

    const asStr = v => (v===null || v===undefined) ? '' : String(v);
    const existingServerIds = new Set(STATE.feedback.map(f=>f.serverId).filter(Boolean));
    let imported = 0;
    let latestReceivedAt = s.lastSyncedAt || '';
    list.forEach(entry=>{
      if(entry.id && existingServerIds.has(entry.id)) return; // already imported
      const f = newFeedback();
      f.serverId = entry.id || '';
      f.yachtName = entry.yacht_name || '';
      f.charterStartDate = entry.charter_start_date || '';
      f.charterEndDate = entry.charter_end_date || '';
      f.cruisingArea = entry.cruising_area || '';
      f.expectations = asStr(entry.expectations);
      f.testimonial = entry.testimonial || '';
      f.improvements = entry.improvements || '';
      f.wouldReturn = entry.would_return || '';
      f.wouldRecommend = entry.would_recommend || '';
      f.ratings.yacht = asStr(entry.rating_yacht);
      f.ratings.crew = asStr(entry.rating_crew);
      f.ratings.service = asStr(entry.rating_service);
      f.ratings.communication = asStr(entry.rating_communication);
      f.ratings.organisation = asStr(entry.rating_organisation);
      f.ratings.itinerary = asStr(entry.rating_itinerary);
      f.ratings.food = asStr(entry.rating_food);
      f.ratings.watertoys = asStr(entry.rating_watertoys);
      f.ratings.overall = asStr(entry.rating_overall);
      if(f.yachtName){
        const match = STATE.cases.find(cs => cs.yachtName && cs.yachtName.toLowerCase()===f.yachtName.toLowerCase()
          && (!f.charterStartDate || cs.charterStartDate===f.charterStartDate));
        if(match) f.linkedCaseId = match.id;
      }
      STATE.feedback.push(f);
      imported++;
      if(entry.received_at && entry.received_at > latestReceivedAt) latestReceivedAt = entry.received_at;
    });
    STATE.feedbackSync.lastSyncedAt = latestReceivedAt || new Date().toISOString();
    persistAndRender();
    showToast(imported > 0 ? (imported + ' new feedback ' + (imported===1?'entry':'entries') + ' synced') : 'No new feedback since last sync');
  }catch(err){
    showToast('Sync failed: ' + err.message, 'error');
    if(btn){ btn.disabled = false; btn.textContent = 'Sync from server'; }
  }
}

/* Reuses the same Supabase project URL + service_role key entered for
   Feedback sync (Feedback → Feedback settings) — preference_lists lives in
   the same project, so there's no reason to make someone enter the same
   credentials twice. */
async function syncPreferenceListsFromServer(){
  const s = STATE.feedbackSync;
  if(!s.endpointUrl){ showToast('Enter the Supabase project URL first (Feedback → Feedback settings).', 'error'); return; }
  if(!s.secretKey){ showToast('Enter the Supabase service_role key first (Feedback → Feedback settings).', 'error'); return; }
  const btn = document.getElementById('btn-sync-preflists');
  if(btn){ btn.disabled = true; btn.textContent = 'Syncing…'; }
  try{
    const base = s.endpointUrl.replace(/\/$/, '');
    const url = new URL(base + '/rest/v1/preference_lists');
    url.searchParams.set('select', '*');
    url.searchParams.set('order', 'received_at.asc');
    if(STATE.preferenceListSync.lastSyncedAt) url.searchParams.set('received_at', 'gt.' + STATE.preferenceListSync.lastSyncedAt);
    const res = await fetch(url.toString(), {
      headers: { 'apikey': s.secretKey, 'Authorization': 'Bearer ' + s.secretKey }
    });
    if(!res.ok) throw new Error('Supabase responded with ' + res.status);
    const list = await res.json();
    if(!Array.isArray(list)) throw new Error('Unexpected response format');

    const existingServerIds = new Set(STATE.preferenceLists.map(p=>p.serverId).filter(Boolean));
    let imported = 0;
    let latestReceivedAt = STATE.preferenceListSync.lastSyncedAt || '';
    list.forEach(entry=>{
      if(entry.id && existingServerIds.has(entry.id)) return; // already imported
      const pl = { id: uid(), serverId: entry.id || '', receivedAt: entry.received_at || '', linkedCaseId: '', data: entry };
      const yacht = (entry.yacht_name||'').toLowerCase();
      if(yacht){
        const match = STATE.cases.find(cs => cs.yachtName && cs.yachtName.toLowerCase()===yacht
          && (!entry.charter_start_date || cs.charterStartDate===entry.charter_start_date));
        if(match) pl.linkedCaseId = match.id;
      }
      STATE.preferenceLists.push(pl);
      imported++;
      if(entry.received_at && entry.received_at > latestReceivedAt) latestReceivedAt = entry.received_at;
    });
    STATE.preferenceListSync.lastSyncedAt = latestReceivedAt || new Date().toISOString();
    persistAndRender();
    showToast(imported > 0 ? (imported + ' new preference list' + (imported===1?'':'s') + ' synced') : 'No new preference lists since last sync');
  }catch(err){
    showToast('Sync failed: ' + err.message, 'error');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'Sync from server'; }
  }
}

function handleImportCsv(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const rows = parseCsv(String(ev.target.result));
      if(rows.length < 2){ showToast('This CSV has no data rows.', 'error'); e.target.value=''; return; }
      const headers = rows[0];
      const col = {
        yacht: findColumn(headers, 'yacht name'),
        start: findColumn(headers, 'starting date', 'embark'),
        end: findColumn(headers, 'ending date', 'disembark'),
        area: findColumn(headers, 'cruising area'),
        expectations: findColumn(headers, 'expectations'),
        rYacht: findColumn(headers, 'the yacht'),
        rCrew: findColumn(headers, 'the crew'),
        rService: findColumn(headers, 'service & attention', 'service and attention'),
        rComm: findColumn(headers, 'communication before'),
        rOrg: findColumn(headers, 'organisation & arrangements', 'organization'),
        rItin: findColumn(headers, 'itinerary'),
        rFood: findColumn(headers, 'food & dining', 'food and dining'),
        rWater: findColumn(headers, 'water toys'),
        rOverall: findColumn(headers, 'overall charter experience'),
        testimonial: findColumn(headers, 'leave us a few words', 'share with future'),
        improvements: findColumn(headers, 'done differently'),
        wouldReturn: findColumn(headers, 'come back again'),
        wouldRecommend: findColumn(headers, 'recommend this yacht'),
        submitted: findColumn(headers, 'submission date', 'submit date', 'date created', 'created at')
      };
      let imported = 0;
      for(let r=1;r<rows.length;r++){
        const row = rows[r];
        if(!row || row.every(v=>!v || !v.trim())) continue;
        const get = idx => idx>-1 ? (row[idx]||'').trim() : '';
        const f = newFeedback();
        f.yachtName = get(col.yacht);
        f.charterStartDate = csvToDate(get(col.start));
        f.charterEndDate = csvToDate(get(col.end));
        f.cruisingArea = get(col.area);
        f.expectations = get(col.expectations).replace(/\D/g,'').slice(0,1);
        f.ratings.yacht = get(col.rYacht).replace(/\D/g,'');
        f.ratings.crew = get(col.rCrew).replace(/\D/g,'');
        f.ratings.service = get(col.rService).replace(/\D/g,'');
        f.ratings.communication = get(col.rComm).replace(/\D/g,'');
        f.ratings.organisation = get(col.rOrg).replace(/\D/g,'');
        f.ratings.itinerary = get(col.rItin).replace(/\D/g,'');
        f.ratings.food = get(col.rFood).replace(/\D/g,'');
        f.ratings.watertoys = get(col.rWater).replace(/\D/g,'');
        f.ratings.overall = get(col.rOverall).replace(/\D/g,'');
        f.testimonial = get(col.testimonial);
        f.improvements = get(col.improvements);
        f.wouldReturn = csvYesNo(get(col.wouldReturn));
        f.wouldRecommend = csvYesNo(get(col.wouldRecommend));
        f.submittedDate = csvToDate(get(col.submitted));
        // try to auto-link to a charter file by matching yacht + overlapping dates
        if(f.yachtName){
          const match = STATE.cases.find(cs => cs.yachtName && cs.yachtName.toLowerCase()===f.yachtName.toLowerCase()
            && (!f.charterStartDate || cs.charterStartDate===f.charterStartDate));
          if(match) f.linkedCaseId = match.id;
        }
        STATE.feedback.push(f);
        imported++;
      }
      persistAndRender();
      showToast(imported + ' feedback ' + (imported===1?'entry':'entries') + ' imported — please review the fields, matching is not always exact.');
    }catch(err){
      showToast('Could not read this CSV: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function copyToClipboard(text){
  function fallbackCopy(){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if(ok) showToast('Link copied to clipboard');
      else showToast('Could not copy automatically — link: ' + text, 'error');
    }catch(e){
      showToast('Could not copy automatically — link: ' + text, 'error');
    }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      ()=>showToast('Link copied to clipboard'),
      ()=>fallbackCopy()
    );
  }else{
    fallbackCopy();
  }
}

function showToast(msg, type){
  const t = document.createElement('div');
  t.className='toast';
  if(type==='error') t.style.borderLeftColor = 'var(--danger)';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 4200);
}

if(MULTIUSER_ENABLED){
  supabaseClient.auth.onAuthStateChange((event, session)=>{
    if(event === 'SIGNED_IN' && session && session.user){
      currentUser = session.user;
      loadFromServer().then(()=>{ render(); subscribeToServerChanges(); });
    }else if(event === 'SIGNED_OUT'){
      currentUser = null;
      renderLoginGate();
    }
  });
  supabaseClient.auth.getSession().then(({data})=>{
    if(data && data.session && data.session.user){
      currentUser = data.session.user;
      loadFromServer().then(()=>{ render(); subscribeToServerChanges(); });
    }else{
      renderLoginGate();
    }
  });
}else{
  render(); // no Supabase configured — works exactly as a local, single-user file
}
