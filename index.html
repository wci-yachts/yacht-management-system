    }));
    app.querySelectorAll('[data-pay-date]').forEach(el=>el.addEventListener('change', ()=>{
      const key = el.dataset.payDate;
      const cur = paymentStatus(c,key);
      c.payments[key] = {status:cur.status, paidDate: el.value};
      persistOnly();
    }));
    app.querySelectorAll('[data-hide-payment]').forEach(el=>el.addEventListener('click', ()=>{
      if(!c.hiddenPayments) c.hiddenPayments = {};
      c.hiddenPayments[el.dataset.hidePayment] = true;
      persistAndRender();
    }));
    app.querySelectorAll('[data-sale-due]').forEach(el=>el.addEventListener('change', ()=>{
      if(!c.saleDueDates) c.saleDueDates = {};
      c.saleDueDates[el.dataset.saleDue] = el.value;
      persistAndRender();
    }));
    /* Manual-drag reordering using Pointer Events with pointer capture.
       Pointer capture keeps every subsequent move/up event routed to the
       handle that started the drag even if the cursor slips outside the row
       or near the edge of a small preview panel — a plain mousemove/mouseup
       pair (or the native HTML5 drag API) loses the gesture in exactly that
       situation, which is what was breaking it. A small auto-scroll near the
       top/bottom edge makes long tables reachable too.
       Preset and extra payments share one ordered list (see
       getUnifiedScheduleRows) so either can be dragged anywhere among the
       other, not just reordered within its own group. */
    function startRowDrag(handle, srcRow, srcId, e, findRow, applyReorder){
      if(e.button!==undefined && e.button!==0) return;
      e.preventDefault();
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
      srcRow.classList.add('dragging-row');
      let overRow = null;
      let overPosition = null; // 'before' | 'after'
      let scrollTimer = null;
      function clearIndicator(){
        if(overRow) overRow.classList.remove('drag-insert-before','drag-insert-after');
      }
      function autoScroll(clientY){
        clearInterval(scrollTimer);
        const edge = 70;
        if(clientY < edge) scrollTimer = setInterval(()=>window.scrollBy(0,-18), 16);
        else if(clientY > window.innerHeight - edge) scrollTimer = setInterval(()=>window.scrollBy(0,18), 16);
      }
      function onMove(ev){
        autoScroll(ev.clientY);
        const row = findRow(ev.clientX, ev.clientY);
        if(row && row!==srcRow){
          const rect = row.getBoundingClientRect();
          const before = (ev.clientY - rect.top) < rect.height/2;
          if(row!==overRow) clearIndicator();
          row.classList.remove('drag-insert-before','drag-insert-after');
          row.classList.add(before ? 'drag-insert-before' : 'drag-insert-after');
          overRow = row;
          overPosition = before ? 'before' : 'after';
        }else{
          clearIndicator();
          overRow = null;
          overPosition = null;
        }
      }
      function onUp(ev){
        clearInterval(scrollTimer);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        try{ handle.releasePointerCapture(ev.pointerId); }catch(err){}
        srcRow.classList.remove('dragging-row');
        clearIndicator();
        if(overRow) applyReorder(srcId, overRow, overPosition);
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    }
    function reorderUnified(srcId, targetId, position){
      if(!targetId || targetId===srcId) return;
      const order = getUnifiedScheduleRows(c).map(r=>r.id);
      const from = order.indexOf(srcId);
      if(from===-1) return;
      order.splice(from,1);
      let to = order.indexOf(targetId);
      if(to===-1) return;
      if(position==='after') to += 1;
      order.splice(to,0,srcId);
      c.paymentOrder = order;
      persistAndRender();
    }
    app.querySelectorAll('[data-drag-id]').forEach(handle=>{
      handle.addEventListener('pointerdown', (e)=>{
        const srcRow = handle.closest('tr');
        if(!srcRow) return;
        startRowDrag(handle, srcRow, handle.dataset.dragId, e,
          (x,y)=>{ const el=document.elementFromPoint(x,y); return el ? el.closest('tr[data-row-id]') : null; },
          (srcId, targetRow, position)=> reorderUnified(srcId, targetRow.dataset.rowId, position));
      });
    });
    /* Simple, always-reliable fallback next to the drag handle: plain click
       buttons that swap the row with its neighbour. */
    app.querySelectorAll('[data-move-id]').forEach(el=>el.addEventListener('click', ()=>{
      const id = el.dataset.moveId;
      const dir = el.dataset.moveDir;
      const order = getUnifiedScheduleRows(c).map(r=>r.id);
      const idx = order.indexOf(id);
      const swapWith = dir==='up' ? idx-1 : idx+1;
      if(idx<0 || swapWith<0 || swapWith>=order.length) return;
      [order[idx], order[swapWith]] = [order[swapWith], order[idx]];
      c.paymentOrder = order;
      persistAndRender();
    }));
    app.querySelectorAll('[data-override]').forEach(el=>{
      el.addEventListener(liveEventFor(el), ()=>{
        if(!c.paymentOverrides) c.paymentOverrides = {};
        const key = el.dataset.overrideKey;
        const field = el.dataset.override; // 'amount' | 'note'
        if(!c.paymentOverrides[key]) c.paymentOverrides[key] = {amount:'', note:''};
        c.paymentOverrides[key][field] = el.value;
        persistOnly();
        softRerenderCase(el);
      });
    });
    /* format every money field to two decimals once the person leaves it —
       e.g. typing "40000" becomes "40000.00" on blur — so every amount in
       the file follows the same €1,000.00-style formatting */
    app.querySelectorAll('input[type="text"][data-money]').forEach(el=>{
      el.addEventListener('blur', ()=>{
        if(suppressMoneyBlur) return; // this blur was caused by our own re-render removing the element, not a real navigate-away
        if(el.value==='') return;
        const n = parseFloat(el.value);
        if(isNaN(n)) return;
        const formatted = n.toFixed(2);
        el.value = formatted; // update what's on screen directly — no re-render needed for that part
        if(el.dataset.f){
          c[el.dataset.f] = formatted;
        }else if(el.dataset.override){
          if(!c.paymentOverrides) c.paymentOverrides = {};
          const k = el.dataset.overrideKey;
          if(!c.paymentOverrides[k]) c.paymentOverrides[k] = {amount:'', note:''};
          c.paymentOverrides[k][el.dataset.override] = formatted;
        }else if(el.dataset.custom){
          c.customPayments[+el.dataset.customIdx][el.dataset.custom] = formatted;
        }else if(el.dataset.recon){
          c.reconciliation[el.dataset.recon] = formatted;
        }
        /* Deliberately NOT re-rendering here. A blur can fire at almost any
           moment — mid-click into a different field, during a focus
           transition the browser hasn't finished settling yet — and every
           attempt to reconcile a render against "whatever has focus by the
           time it runs" turned out to be a race that occasionally rebuilt
           the DOM at exactly the wrong instant, silently eating keystrokes
           the person had already typed into the next field. Updating the
           input's own display value and the saved state (above) is enough:
           it's correct on screen right now, and anything elsewhere that
           depends on it (an "expected" placeholder, a cascade warning) will
           catch up the next time something else naturally triggers a
           render — which is always very soon. */
        persistOnly();
      });
    });
    app.querySelectorAll('[data-restore-payment]').forEach(el=>el.addEventListener('click', ()=>{
      if(c.hiddenPayments) delete c.hiddenPayments[el.dataset.restorePayment];
      persistAndRender();
    }));
    app.querySelectorAll('[data-att]').forEach(el=>el.addEventListener('change', ()=>{
      c.attachments[el.dataset.att] = el.checked;
      persistOnly();
    }));
    const addBtn = app.querySelector('[data-addendum-add]');
    if(addBtn) addBtn.addEventListener('click', ()=>{
      c.attachments.addendums.push({name:'', done:false});
      persistAndRender();
    });
    app.querySelectorAll('[data-addendum-toggle]').forEach(el=>el.addEventListener('change', ()=>{
      c.attachments.addendums[+el.dataset.addendumToggle].done = el.checked;
      persistOnly();
    }));
    app.querySelectorAll('[data-addendum-name]').forEach(el=>el.addEventListener('input', ()=>{
      c.attachments.addendums[+el.dataset.addendumName].name = el.value;
      persistOnly();
    }));
    app.querySelectorAll('[data-addendum-remove]').forEach(el=>el.addEventListener('click', ()=>{
      c.attachments.addendums.splice(+el.dataset.addendumRemove,1);
      persistAndRender();
    }));

    /* extra / custom payments */
    const addPayBtn = app.querySelector('[data-custom-add]');
    if(addPayBtn) addPayBtn.addEventListener('click', ()=>{
      c.customPayments.push({id: uid(), description:'', reason:'', direction:'out', amount:'', due:'', status:'pending', paidDate:''});
      persistAndRender();
    });
    app.querySelectorAll('[data-custom-remove]').forEach(el=>el.addEventListener('click', ()=>{
      c.customPayments.splice(+el.dataset.customRemove,1);
      persistAndRender();
    }));
    app.querySelectorAll('[data-custom]').forEach(el=>{
      el.addEventListener(liveEventFor(el), ()=>{
        const idx = +el.dataset.customIdx;
        const field = el.dataset.custom;
        c.customPayments[idx][field] = el.value;
        persistOnly();
        softRerenderCase(el);
      });
    });
    app.querySelectorAll('[data-custom-pay-toggle]').forEach(el=>el.addEventListener('change', ()=>{
      const idx = +el.dataset.customPayToggle;
      const cp = c.customPayments[idx];
      cp.status = el.checked ? 'paid' : 'pending';
      if(el.checked && !cp.paidDate) cp.paidDate = toISODate(new Date());
      persistAndRender();
    }));
    app.querySelectorAll('[data-custom-pay-date]').forEach(el=>el.addEventListener('change', ()=>{
      c.customPayments[+el.dataset.customPayDate].paidDate = el.value;
      persistOnly();
    }));

    /* reconciliation adjustment */
    app.querySelectorAll('[data-recon]').forEach(el=>{
      el.addEventListener(liveEventFor(el), ()=>{
        c.reconciliation[el.dataset.recon] = el.value;
        persistOnly();
        softRerenderCase(el);
      });
    });
  }
}

function focusEl(id){
  const el = document.getElementById(id);
  if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; }
}

/* re-render just the case view without losing input focus for text typing in other fields
   — for simplicity & correctness with computed fields (commission/VAT/APA totals depending
   on rate), we re-render the whole case view but keep focus on the active element by id/name. */
let suppressMoneyBlur = false; // true only while softRerenderCase is tearing down & rebuilding the DOM
function softRerenderCase(activeEl){
  const active = document.activeElement;
  const f = active && active.dataset ? active.dataset.f : null;
  const fbField = active && active.dataset ? active.dataset.fb : null;
  const customField = active && active.dataset ? active.dataset.custom : null;
  const customIdx = active && active.dataset ? active.dataset.customIdx : null;
  const reconField = active && active.dataset ? active.dataset.recon : null;
  const overrideField = active && active.dataset ? active.dataset.override : null;
  const overrideKey = active && active.dataset ? active.dataset.overrideKey : null;
  const fbsyncField = active && active.dataset ? active.dataset.fbsync : null;
  const canSelect = supportsSelectionRange(active);
  const selStart = canSelect ? active.selectionStart : null;
  const selEnd = canSelect ? active.selectionEnd : null;
  /* Rebuilding the DOM below removes the currently-focused input, which makes
     the browser fire a genuine 'blur' event on it as a side effect — even
     though the person never actually left the field. The money-formatting
     blur handler would otherwise treat that as "done typing" and format the
     value after a single keystroke, which is exactly what was cutting typing
     off after one digit. Suppress it for just this synchronous re-render. */
  suppressMoneyBlur = true;
  render();
  suppressMoneyBlur = false;
  let again = null;
  if(f) again = document.querySelector(`[data-f="${f}"]`);
  else if(fbField) again = document.querySelector(`[data-fb="${fbField}"]`);
  else if(customField!=null && customIdx!=null) again = document.querySelector(`[data-custom="${customField}"][data-custom-idx="${customIdx}"]`);
  else if(reconField) again = document.querySelector(`[data-recon="${reconField}"]`);
  else if(overrideField && overrideKey) again = document.querySelector(`[data-override="${overrideField}"][data-override-key="${overrideKey}"]`);
  else if(fbsyncField) again = document.querySelector(`[data-fbsync="${fbsyncField}"]`);
  if(again){
    again.focus();
    if(canSelect && supportsSelectionRange(again)){
      try{ again.setSelectionRange(selStart, selEnd); }catch(e){}
    }else if(again.tagName==='INPUT' && again.type==='number'){
      /* number inputs don't support setSelectionRange; re-assigning the value
         after focus is what actually pushes the caret to the end in every
         browser, which is what stops digits from being prepended (reversed)
         on every keystroke. */
      const v = again.value;
      again.value = '';
      again.value = v;
    }
  }
}

function persistOnly(){ tryPersistLocal(); }
function persistAndRender(){ tryPersistLocal(); render(); }

/* ---------------- export / import ---------------- */
function exportData(){
  const blob = new Blob([JSON.stringify({cases:STATE.cases, nextCaseSeq, feedback:STATE.feedback, feedbackSync:STATE.feedbackSync}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'charter-files-' + toISODate(new Date()) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Data exported');
}
function handleImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(parsed && Array.isArray(parsed.cases)){
        STATE.cases = normalizeCases(parsed.cases);
        nextCaseSeq = parsed.nextCaseSeq || (STATE.cases.length+1);
        STATE.feedback = normalizeFeedbackList(parsed.feedback||[]);
        if(parsed.feedbackSync && typeof parsed.feedbackSync==='object'){
          STATE.feedbackSync = Object.assign({formLink:'', endpointUrl:'', secretKey:'', lastSyncedAt:''}, parsed.feedbackSync);
        }
        STATE.view = {tab:'cases', caseId:null};
        persistAndRender();
        showToast('Data imported successfully');
      }else{
        showToast('This file does not look like a valid export.', 'error');
      }
    }catch(err){
      showToast('Could not read this file: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ---------------- Jotform CSV import (client feedback) ----------------
   Jotform's CSV export uses the visible question text as column headers, so
   we match column names loosely against the question wording rather than an
   exact schema. Every field is a normal editable field afterwards, so a
   partial or slightly-off match is easy to fix by hand in the app. */
function parseCsv(text){
  // Handles quoted fields (with escaped "" and embedded commas/newlines).
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i], next = text[i+1];
    if(inQuotes){
      if(ch === '"' && next === '"'){ field += '"'; i++; }
      else if(ch === '"'){ inQuotes = false; }
      else field += ch;
    }else{
      if(ch === '"') inQuotes = true;
      else if(ch === ','){ row.push(field); field=''; }
      else if(ch === '\r'){ /* skip */ }
      else if(ch === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += ch;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length>1 || (r.length===1 && r[0]!==''));
}
function findColumn(headers, ...keywords){
  const lower = headers.map(h=>h.toLowerCase());
  for(const kw of keywords){
    const idx = lower.findIndex(h => h.includes(kw));
    if(idx>-1) return idx;
  }
  return -1;
}
function csvYesNo(v){
  const s = (v||'').trim().toLowerCase();
  if(s==='yes' || s==='y' || s==='true') return 'yes';
  if(s==='no' || s==='n' || s==='false') return 'no';
  return '';
}
function csvToDate(v){
  if(!v) return '';
  const s = v.trim();
  // Jotform date exports are commonly "MM-DD-YYYY", "DD-MM-YYYY" or "YYYY-MM-DD" depending on form locale.
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(m){
    // ambiguous MM-DD vs DD-MM — Jotform's default widget order is Month, Day, Year
    const mm = m[1].padStart(2,'0'), dd = m[2].padStart(2,'0');
    return `${m[3]}-${mm}-${dd}`;
  }
  return '';
}
/* ---------------- server sync (feedback-form.html + PHP backend) ---------------- */
async function syncFeedbackFromServer(){
  const s = STATE.feedbackSync;
  if(!s.endpointUrl){ showToast('Enter the Supabase project URL first.', 'error'); return; }
  if(!s.secretKey){ showToast('Enter the Supabase service_role key first.', 'error'); return; }
  const btn = document.getElementById('btn-sync-feedback');
  if(btn){ btn.disabled = true; btn.textContent = 'Syncing…'; }
  try{
    const base = s.endpointUrl.replace(/\/$/, '');
    const url = new URL(base + '/rest/v1/feedback');
    url.searchParams.set('select', '*');
    url.searchParams.set('order', 'received_at.asc');
    if(s.lastSyncedAt) url.searchParams.set('received_at', 'gt.' + s.lastSyncedAt);
    const res = await fetch(url.toString(), {
      headers: { 'apikey': s.secretKey, 'Authorization': 'Bearer ' + s.secretKey }
    });
    if(!res.ok) throw new Error('Supabase responded with ' + res.status);
    const list = await res.json();
    if(!Array.isArray(list)) throw new Error('Unexpected response format');

    const asStr = v => (v===null || v===undefined) ? '' : String(v);
    const existingServerIds = new Set(STATE.feedback.map(f=>f.serverId).filter(Boolean));
    let imported = 0;
    let latestReceivedAt = s.lastSyncedAt || '';
    list.forEach(entry=>{
      if(entry.id && existingServerIds.has(entry.id)) return; // already imported
      const f = newFeedback();
      f.serverId = entry.id || '';
      f.yachtName = entry.yacht_name || '';
      f.charterStartDate = entry.charter_start_date || '';
      f.charterEndDate = entry.charter_end_date || '';
      f.cruisingArea = entry.cruising_area || '';
      f.expectations = asStr(entry.expectations);
      f.testimonial = entry.testimonial || '';
      f.improvements = entry.improvements || '';
      f.wouldReturn = entry.would_return || '';
      f.wouldRecommend = entry.would_recommend || '';
      f.ratings.yacht = asStr(entry.rating_yacht);
      f.ratings.crew = asStr(entry.rating_crew);
      f.ratings.service = asStr(entry.rating_service);
      f.ratings.communication = asStr(entry.rating_communication);
      f.ratings.organisation = asStr(entry.rating_organisation);
      f.ratings.itinerary = asStr(entry.rating_itinerary);
      f.ratings.food = asStr(entry.rating_food);
      f.ratings.watertoys = asStr(entry.rating_watertoys);
      f.ratings.overall = asStr(entry.rating_overall);
      if(f.yachtName){
        const match = STATE.cases.find(cs => cs.yachtName && cs.yachtName.toLowerCase()===f.yachtName.toLowerCase()
          && (!f.charterStartDate || cs.charterStartDate===f.charterStartDate));
        if(match) f.linkedCaseId = match.id;
      }
      STATE.feedback.push(f);
      imported++;
      if(entry.received_at && entry.received_at > latestReceivedAt) latestReceivedAt = entry.received_at;
    });
    STATE.feedbackSync.lastSyncedAt = latestReceivedAt || new Date().toISOString();
    persistAndRender();
    showToast(imported > 0 ? (imported + ' new feedback ' + (imported===1?'entry':'entries') + ' synced') : 'No new feedback since last sync');
  }catch(err){
    showToast('Sync failed: ' + err.message, 'error');
    if(btn){ btn.disabled = false; btn.textContent = 'Sync from server'; }
  }
}

function handleImportCsv(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const rows = parseCsv(String(ev.target.result));
      if(rows.length < 2){ showToast('This CSV has no data rows.', 'error'); e.target.value=''; return; }
      const headers = rows[0];
      const col = {
        yacht: findColumn(headers, 'yacht name'),
        start: findColumn(headers, 'starting date', 'embark'),
        end: findColumn(headers, 'ending date', 'disembark'),
        area: findColumn(headers, 'cruising area'),
        expectations: findColumn(headers, 'expectations'),
        rYacht: findColumn(headers, 'the yacht'),
        rCrew: findColumn(headers, 'the crew'),
        rService: findColumn(headers, 'service & attention', 'service and attention'),
        rComm: findColumn(headers, 'communication before'),
        rOrg: findColumn(headers, 'organisation & arrangements', 'organization'),
        rItin: findColumn(headers, 'itinerary'),
        rFood: findColumn(headers, 'food & dining', 'food and dining'),
        rWater: findColumn(headers, 'water toys'),
        rOverall: findColumn(headers, 'overall charter experience'),
        testimonial: findColumn(headers, 'leave us a few words', 'share with future'),
        improvements: findColumn(headers, 'done differently'),
        wouldReturn: findColumn(headers, 'come back again'),
        wouldRecommend: findColumn(headers, 'recommend this yacht'),
        submitted: findColumn(headers, 'submission date', 'submit date', 'date created', 'created at')
      };
      let imported = 0;
      for(let r=1;r<rows.length;r++){
        const row = rows[r];
        if(!row || row.every(v=>!v || !v.trim())) continue;
        const get = idx => idx>-1 ? (row[idx]||'').trim() : '';
        const f = newFeedback();
        f.yachtName = get(col.yacht);
        f.charterStartDate = csvToDate(get(col.start));
        f.charterEndDate = csvToDate(get(col.end));
        f.cruisingArea = get(col.area);
        f.expectations = get(col.expectations).replace(/\D/g,'').slice(0,1);
        f.ratings.yacht = get(col.rYacht).replace(/\D/g,'');
        f.ratings.crew = get(col.rCrew).replace(/\D/g,'');
        f.ratings.service = get(col.rService).replace(/\D/g,'');
        f.ratings.communication = get(col.rComm).replace(/\D/g,'');
        f.ratings.organisation = get(col.rOrg).replace(/\D/g,'');
        f.ratings.itinerary = get(col.rItin).replace(/\D/g,'');
        f.ratings.food = get(col.rFood).replace(/\D/g,'');
        f.ratings.watertoys = get(col.rWater).replace(/\D/g,'');
        f.ratings.overall = get(col.rOverall).replace(/\D/g,'');
        f.testimonial = get(col.testimonial);
        f.improvements = get(col.improvements);
        f.wouldReturn = csvYesNo(get(col.wouldReturn));
        f.wouldRecommend = csvYesNo(get(col.wouldRecommend));
        f.submittedDate = csvToDate(get(col.submitted));
        // try to auto-link to a charter file by matching yacht + overlapping dates
        if(f.yachtName){
          const match = STATE.cases.find(cs => cs.yachtName && cs.yachtName.toLowerCase()===f.yachtName.toLowerCase()
            && (!f.charterStartDate || cs.charterStartDate===f.charterStartDate));
          if(match) f.linkedCaseId = match.id;
        }
        STATE.feedback.push(f);
        imported++;
      }
      persistAndRender();
      showToast(imported + ' feedback ' + (imported===1?'entry':'entries') + ' imported — please review the fields, matching is not always exact.');
    }catch(err){
      showToast('Could not read this CSV: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function copyToClipboard(text){
  function fallbackCopy(){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if(ok) showToast('Link copied to clipboard');
      else showToast('Could not copy automatically — link: ' + text, 'error');
    }catch(e){
      showToast('Could not copy automatically — link: ' + text, 'error');
    }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      ()=>showToast('Link copied to clipboard'),
      ()=>fallbackCopy()
    );
  }else{
    fallbackCopy();
  }
}

function showToast(msg, type){
  const t = document.createElement('div');
  t.className='toast';
  if(type==='error') t.style.borderLeftColor = 'var(--danger)';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 4200);
}

/* ---------------- init ---------------- */
tryLoadLocal(); // instant local cache — snappy even before the network responds
if(MULTIUSER_ENABLED){
  supabaseClient.auth.onAuthStateChange((event, session)=>{
    if(event === 'SIGNED_IN' && session && session.user){
      currentUser = session.user;
      loadFromServer().then(()=>{ render(); subscribeToServerChanges(); });
    }else if(event === 'SIGNED_OUT'){
      currentUser = null;
      renderLoginGate();
    }
  });
  supabaseClient.auth.getSession().then(({data})=>{
    if(data && data.session && data.session.user){
      currentUser = data.session.user;
      loadFromServer().then(()=>{ render(); subscribeToServerChanges(); });
    }else{
      renderLoginGate();
    }
  });
}else{
  render(); // no Supabase configured — works exactly as a local, single-user file
}
